<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>段考考點闖關</title>
<style>
:root{--bg:#f5efe4;--card:#fffdf8;--ink:#3b3226;--soft:#8a7d6a;--line:#e3d4b8;--gold:#b8955a;--gold2:#8c6d3b;--ok:#6f9a6a;--no:#c9a27a;
--a:#f3e1dc;--b:#e5e8ec;--c:#e3e9d9;--d:#f2e7cc;--e:#ebe3ee;}
@media (prefers-color-scheme:dark){:root{--bg:#211d18;--card:#2c2620;--ink:#f2eadb;--soft:#b8aa92;--line:#4a3f30;--gold:#d2b47a;--gold2:#e2c891;
--a:#4f3a36;--b:#3a3d42;--c:#3c4334;--d:#4b4130;--e:#443a48;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:20px;line-height:1.6;
background:var(--bg) repeating-conic-gradient(from 0deg at 50% -10%,rgba(184,149,90,.07) 0 3deg,transparent 3deg 12deg) fixed}
.serif,h1,.ttl,.nm{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
.wrap{max-width:680px;margin:0 auto;padding:58px 16px 90px}
.hero{display:flex;align-items:center;gap:16px;margin:20px 0 22px}
.arch{flex:none;width:118px;aspect-ratio:3/4;border-radius:60px 60px 14px 14px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 5px var(--card),0 0 0 6px var(--line),0 10px 26px rgba(140,109,59,.25);background:var(--card)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.hero h1{font-size:28px;margin:0;line-height:1.3;color:var(--gold2)}
.hero .sub{text-align:left;margin:6px 0 0}
.orn{color:var(--gold);letter-spacing:6px;font-size:14px}
.sub{color:var(--soft);font-size:16px}
.stars{position:fixed;top:10px;right:12px;background:var(--card);border:1.5px solid var(--gold);color:var(--gold2);border-radius:30px;padding:4px 14px;font-weight:700;z-index:5}
.map{display:grid;gap:14px}
.sec{margin:14px 0 -2px;font-family:"Noto Serif TC","Songti TC",serif;font-weight:800;color:var(--gold2);font-size:19px;border-bottom:1px solid var(--line);padding-bottom:4px}
.lv{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .15s,border-color .2s;box-shadow:0 4px 14px rgba(140,109,59,.08)}
.lv:hover{border-color:var(--gold)}
.lv:active{transform:scale(.97)}
.lv .em{font-size:36px;width:56px;height:56px;display:grid;place-items:center;border-radius:50%;background:var(--d);border:1.5px solid var(--gold)}
.lv .nm{font-weight:800;font-size:21px}
.lv .ds{font-size:15px;color:var(--soft)}
.lv .ck{margin-left:auto;font-size:26px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:var(--card);border:1.5px solid var(--gold);border-radius:14px;font-size:18px;padding:6px 12px;color:var(--ink);cursor:pointer}
.bar{flex:1;height:14px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e8d6ae,#c9a464,#9b7a43);border-radius:10px;transition:width .4s}
.box{position:relative;background:var(--card);border-radius:26px;padding:24px 20px;border:1.5px solid var(--gold);box-shadow:0 0 0 5px var(--card),0 0 0 6px var(--line),0 12px 30px rgba(140,109,59,.12);animation:pop .35s ease}
.box::before,.box::after{content:"✦";position:absolute;top:10px;color:var(--gold);font-size:16px}
.box::before{left:14px}.box::after{right:14px}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.tag{display:inline-block;font-size:15px;padding:2px 12px;border-radius:20px;border:1px solid var(--gold);color:var(--gold2);margin:0 0 8px 18px}
.ttl{font-size:25px;font-weight:800;margin:4px 0 14px;color:var(--gold2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
.chip{padding:8px 14px;border-radius:16px;font-weight:700;font-size:19px;opacity:0;animation:in .4s forwards;border:1px solid rgba(140,109,59,.18)}
.chip.ar{background:none;border:none;padding:0 2px;font-size:22px;color:var(--gold)}
.k-a{background:var(--a)}.k-b{background:var(--b)}.k-c{background:var(--c)}.k-d{background:var(--d)}.k-e{background:var(--e)}
@keyframes in{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.row{width:100%;height:0}
.tip{background:var(--d);border-radius:18px;padding:12px 16px;margin:10px 0 16px;font-size:19px;border-left:4px solid var(--gold)}
.ex{border-left:3px solid var(--gold);padding:6px 0 6px 14px;margin:12px 0;font-size:20px}
.zh{color:var(--soft);font-size:17px;margin-top:4px}
.key{display:inline-block;background:linear-gradient(135deg,#f3e3bd,#d9b977);color:#3b2a10;border-radius:10px;padding:0 10px;cursor:pointer;font-weight:800;animation:wig 1.6s infinite}
.key.open{animation:none;background:#e3ecd8;color:#24361f}
@keyframes wig{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) scale(1.05)}}
.say{border:1px solid var(--gold);background:var(--card);border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;vertical-align:middle;margin-left:6px}
.btn{display:block;width:100%;margin-top:18px;border:none;border-radius:20px;padding:16px;font-size:21px;font-weight:800;background:linear-gradient(135deg,#c9a464,#9b7a43);color:#fffaf0;cursor:pointer;font-family:inherit;letter-spacing:1px;box-shadow:0 6px 16px rgba(140,109,59,.25)}
.btn.alt{background:var(--card);color:var(--gold2);border:1.5px solid var(--gold);box-shadow:none}
.btn:active{transform:scale(.98)}
.q{font-size:21px;font-weight:700;margin:6px 0}
.blank{display:inline-block;min-width:70px;border-bottom:3px dashed var(--gold);text-align:center;color:var(--gold2)}
.opts{display:grid;gap:12px;margin-top:16px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:14px;font-size:20px;text-align:left;cursor:pointer;color:var(--ink);font-family:inherit}
.opt:hover{border-color:var(--gold)}
.opt.ok{border-color:var(--ok);background:#e6efdf;color:#24361f}
.opt.no{border-color:var(--no);opacity:.45;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.why{margin-top:14px;background:#f1ecdc;color:#3b3226;border-radius:18px;padding:12px 16px;font-size:18px;animation:pop .3s}
.cheer{text-align:center;font-size:24px;font-weight:800;margin-top:10px;min-height:34px;color:var(--gold2)}
.again{font-size:14px;background:var(--e);border-radius:12px;padding:2px 10px;margin-left:6px}
.winimg{width:min(260px,70vw);margin:4px auto 10px;aspect-ratio:3/4;border-radius:130px 130px 18px 18px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 6px var(--card),0 0 0 7px var(--line),0 0 40px rgba(201,164,100,.55);animation:float 3s ease-in-out infinite}
.winimg img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes float{50%{transform:translateY(-8px)}}
.fx{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:fall 1.8s linear forwards;z-index:9;color:#c9a464}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.sbtn{display:block;width:100%;margin:0 0 6px;padding:14px;border-radius:20px;border:1.5px solid var(--gold);background:var(--card);color:var(--gold2);font-size:20px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(140,109,59,.08)}
.sq{width:100%;margin-top:4px;padding:14px 16px;font-size:20px;border-radius:18px;border:1.5px solid var(--gold);background:var(--card);color:var(--ink);font-family:inherit;outline:none}
.letters{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.lt{padding:10px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-weight:800;font-family:inherit;cursor:pointer}
.lt.on{background:var(--d);border-color:var(--gold);color:var(--gold2)}
.res{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px;animation:pop .25s}
.rw{font-size:21px;font-weight:800}
.rs{font-size:19px}
.rz{font-size:17px;color:var(--soft);margin-top:4px}
.rtag{display:inline-block;margin-top:8px;font-size:14px;color:var(--gold2);border:1px solid var(--line);border-radius:12px;padding:1px 10px}
.rb{display:flex;align-items:center;gap:10px;margin-top:10px}
.go{flex:1;border:none;border-radius:14px;padding:10px;font-size:17px;font-weight:800;font-family:inherit;background:linear-gradient(135deg,#c9a464,#9b7a43);color:#fffaf0;cursor:pointer}
mark{background:#f3e3bd;color:#3b2a10;border-radius:4px;padding:0 2px}
.res .why{margin-top:8px;font-size:16px}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.tb{padding:12px 4px;font-size:16px!important;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-weight:800;font-family:inherit;cursor:pointer}
.tb.on{background:linear-gradient(135deg,#c9a464,#9b7a43);color:#fffaf0;border-color:transparent;box-shadow:0 6px 16px rgba(140,109,59,.25)}
.prog{margin:0 0 12px}.prog .pt{font-weight:800;color:var(--gold2);margin-bottom:6px;font-size:17px}
.spd{position:fixed;top:10px;left:12px;background:var(--card);border:1.5px solid var(--gold);color:var(--gold2);border-radius:30px;padding:4px 12px;font-weight:700;z-index:5;cursor:pointer;font-size:16px}
.wbox{text-align:center}
.word{margin:14px 0 6px}
.syl{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px}
.sw{display:inline-flex;align-items:center;gap:2px}
.sy{display:inline-block;font-size:40px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:14px;transition:all .18s;color:var(--ink)}
.sy.lit{background:linear-gradient(135deg,#f3e3bd,#d9b977);color:#3b2a10;transform:translateY(-4px) scale(1.08);box-shadow:0 6px 14px rgba(140,109,59,.3)}
.dot{color:var(--gold);font-size:26px;font-weight:800}
.kk{color:var(--soft);font-size:19px;margin-bottom:10px}
.wbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0 14px}
.say.big{width:58px;height:58px;font-size:26px}
.pill{display:inline-flex;align-items:center;border:1.5px solid var(--gold);background:var(--card);color:var(--gold2);border-radius:30px;padding:8px 14px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;text-decoration:none}
.reveal{border:2px dashed var(--gold);background:var(--d);color:var(--gold2);border-radius:18px;padding:14px 22px;font-size:20px;font-weight:800;font-family:inherit;cursor:pointer;animation:wig 1.6s infinite}
.zhbig{font-size:30px;font-weight:900;color:var(--gold2);animation:pop .35s}
.wbox .ex,.wbox .tip{text-align:left}
.mini{text-align:center;margin-top:12px}.mini .sy{font-size:30px}
.burst{position:fixed;inset:0;pointer-events:none;z-index:30;display:grid;place-items:center}
.burst .lines{position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg,rgba(201,164,100,0) 0 5deg,rgba(201,164,100,.45) 5deg 6.2deg);-webkit-mask:radial-gradient(circle,transparent 26%,#000 62%);mask:radial-gradient(circle,transparent 26%,#000 62%);animation:speed .9s ease-out forwards}
.burst .stamp{position:relative;font-family:"Noto Serif TC","Hiragino Mincho ProN",serif;font-size:56px;font-weight:900;color:#c08a2e;-webkit-text-stroke:2px #fffaf0;text-shadow:0 4px 0 #8c6d3b,0 10px 24px rgba(140,109,59,.45);animation:stamp .9s cubic-bezier(.2,1.6,.4,1) forwards;white-space:nowrap}
.burst.big .stamp{font-size:46px}.burst.big .lines,.burst.big .stamp{animation-duration:1.6s}
@keyframes speed{0%{opacity:0;transform:scale(1.4) rotate(0)}25%{opacity:1}100%{opacity:0;transform:scale(1) rotate(8deg)}}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-12deg)}35%{opacity:1;transform:scale(.92) rotate(-6deg)}50%{transform:scale(1.06) rotate(-7deg)}80%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-7deg) translateY(-18px)}}
.flt{position:fixed;z-index:31;transform:translate(-50%,0);font-weight:900;font-size:24px;color:#c08a2e;pointer-events:none;animation:flt 1s ease-out forwards;text-shadow:0 2px 0 #fffaf0}
@keyframes flt{to{transform:translate(-50%,-70px);opacity:0}}
body.shk .wrap{animation:shk .4s}
@keyframes shk{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
@media (max-width:420px){.sy{font-size:32px}.burst .stamp{font-size:42px}.burst.big .stamp{font-size:36px}}

.mkn{display:block;font-size:14px;color:#a31515;margin-top:4px;font-weight:700}
.mkbox{margin:12px 0 4px;text-align:left}
.mkh{font-weight:900;color:var(--gold2);margin-bottom:6px}
.mk{padding:8px 12px;border-radius:12px;margin:6px 0;font-size:17px;color:#2b2b3a;line-height:1.5}
.mk-blue{background:#d4f4f8;border-left:6px solid #1fb6cc}
.mk-green{background:#d9f6d2;border-left:6px solid #2fbf2f}
.mk-yellow{background:#fff4b8;border-left:6px solid #e8bd00}
.mk-red{background:#fde3e3;border-left:6px solid #e03131;color:#a31515;font-weight:700}
.mkl{font-size:13px;color:var(--soft);margin-top:6px}

.chk{background:var(--c);border-radius:18px;padding:12px 16px;margin:6px 0 14px;text-align:left;border-left:6px solid #6f9a6a}
.chkh{font-weight:900;color:#4d7a48;font-size:16px;margin-bottom:4px}
.chkt{font-size:22px;font-weight:700;line-height:1.5}
.ckb{background:#fff1b8;color:#7a4b00;padding:0 6px;border-radius:8px;border-bottom:3px solid #e8bd00}
.chki{margin-top:8px;font-size:17px;color:var(--ink)}
.srcb{font-size:13px;color:var(--gold2);border:1px solid var(--line);border-radius:10px;padding:1px 8px;vertical-align:middle}

.extl{margin:12px 0;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px}
.extl .e1{font-size:17px}.extl .e2{font-size:18px;font-weight:800;color:var(--gold2)}
.extl .ea{margin:6px 0 6px 6px;font-size:16px;color:#4d7a48}

.pstep{font-size:20px;font-weight:900;color:var(--gold2);margin:4px 0 12px}
.sent{font-size:23px;line-height:2.3;padding:6px 2px}
.tk{display:inline-block;padding:0 6px;margin:0;border-radius:8px;cursor:pointer;transition:all .15s;border:2px solid transparent}
.tapme .tk:hover{background:var(--d)}
.tk.tv,.plg .tv{border:2.5px solid #e03131;border-radius:999px;color:#c92a2a;font-weight:800;padding:0 7px}
.tk.tcl,.plg .tcl{background:#d4f4f8;color:#163c44;border-radius:0}
.tk.tcs,.plg .tcs{border-radius:10px 0 0 10px;border-left:3px solid #1fb6cc}
.tk.tce,.plg .tce{border-radius:0 10px 10px 0;border-right:3px solid #1fb6cc}
.plg .tcs.tce{border-radius:10px;border:2px solid #1fb6cc;padding:0 6px}
.tk.ta,.plg .ta{text-decoration:underline wavy #2f9e44 3px;text-underline-offset:6px;font-weight:800}
.tk.tl,.plg .tl{background:#fff1b8;color:#7a4b00;border-radius:8px;font-weight:800;box-shadow:inset 0 -3px 0 #e8bd00}
.tk.tno{animation:shake .4s;background:#fde3e3}
.plg{font-size:14px;color:var(--soft);margin:4px 0 6px;display:flex;flex-wrap:wrap;gap:10px}
.plg span{padding:0 6px}
.pdone{background:var(--card);border:1.5px solid var(--gold);border-radius:18px;padding:14px 16px;margin-top:8px;line-height:1.7;font-size:17px;animation:pop .35s}
.pdh{font-size:20px;font-weight:900;color:var(--gold2);margin-bottom:4px}
</style>
</head>

<div class="stars" id="stars">⭐ 0</div><div class="spd" id="spd" onclick="cycleRate()">🔊 1×</div>
<div class="wrap" id="app"></div>

  tip:"🔑 事情比「看起來」還早發生 → 用 to have p.p.",ex:"It seems that he lost his key. = He [[seems to have lost]] his key.",zh:"他似乎把鑰匙弄丟了。"},
 {t:"quiz",q:"It seems that he was brought up abroad. = He seems ___ abroad.",zh:"他似乎是在國外長大的。",o:["to have been brought up","to be brought up","to bring up","bringing up"],a:0,why:"was brought up 比 seems 早，而且是被動 → to have been p.p.。"},
 {t:"quiz",q:"It seemed that Ken had lost the courage. = Ken ___ the courage.",zh:"Ken 當時似乎已經失去了勇氣。",o:["seemed to have lost","seems to lose","seemed to lose","seems to have lost"],a:0,why:"seemed 是過去，had lost 更早 → seemed to have p.p.。"}
]},
{name:"時間魔法",em:"⏰",ds:"by the time、not…until",items:[

  tip:"🔑 時間點用「簡單式」，動作用「完成式」。",ex:"By the time I reached the beach, the sun [[had already set]].",zh:"等我到海灘時，太陽已經下山了。"},
 {t:"quiz",q:"By the time you finish your homework, ___.",zh:"等你寫完功課，天就會黑了。",o:["it will have turned dark","it is dark","it had turned dark","it has turned dark"],a:0,why:"finish 是現在式（代表未來）→ will have p.p.。"},
 {t:"quiz",q:"In 1930 we laughed 19 minutes a day, but by 1980 it ___ to six minutes.",zh:"到了 1980 年，已經減少到六分鐘。",o:["had decreased","has been decreasing","was decreasing","should have decreased"],a:0,why:"by + 過去時間（1980）→ had p.p.。"},

  tip:"🔑 until 後面是動作的「起點」。放句首要倒裝！",ex:"[[Not until]] you reminded me [[did I realize]] my mistake.",zh:"直到你提醒我，我才發現自己的錯。"},
 {t:"quiz",q:"Not until you reminded me ___ my mistake.",zh:"直到你提醒我，我才發現錯誤。",o:["did I realize","I realized","I did realize","realized I"],a:0,why:"Not until 放句首 → 後面要倒裝：did + I + 原形。"},
 {t:"quiz",q:"The profit didn't tremendously increase ___ the team adopted an innovative approach.",zh:"直到團隊採用創新方法，利潤才大幅增加。",o:["until","since","by the time","while"],a:0,why:"not…until 直到…才開始。"}
]},
{name:"左右對稱",em:"⚖️",ds:"that / those、not only…but also、other",items:[

  tip:"🔑 前面說過的名詞，再出現時換成 that / those。",ex:"The skills needed to manage a team are different from [[those]] needed to sell products.",zh:"管理團隊需要的技能，和賣產品需要的不同。"},
 {t:"quiz",q:"Schools in the north are better equipped, while ___ in the south are relatively poor.",zh:"北部的學校設備較好，南部的則相對較差。",o:["those","they","ones","what"],a:0,why:"代替複數 schools → those。"},

 {t:"quiz",q:"Not only children but also almost every adult ___ over-reliant on electronic devices.",zh:"不只孩童，幾乎每個大人都過度依賴電子產品。",o:["is","are","were","be"],a:0,why:"看 B：every adult 是單數 → is。"},

 {t:"quiz",q:"Lindgren was disqualified ___ asthma.",zh:"Lindgren 因為氣喘被取消資格。",o:["due to","despite","except for","without"],a:0,why:"原因 → due to 因為。"},

 {t:"quiz",q:"An around-the-island trip ___ months of preparation.",zh:"環島旅行需要數個月的準備。",o:["calls for","pays off","sets off","turns out"],a:0,why:"call for 需要。"},

 {t:"quiz",q:"Although we may ___ anesthesia ___ today, we should remain grateful.",zh:"雖然我們可能把麻醉視為理所當然…",o:["take … for granted","call … for","map … out","turn … down"],a:0,why:"take sth for granted 視為理所當然。"},

 {t:"quiz",q:"While group trips offer many advantages, they are not always ___.",zh:"團體旅行不總是一帆風順。",o:["smooth sailing","a rite of passage","worth a fortune","nothing but"],a:0,why:"一帆風順 → smooth sailing。"},

 {t:"quiz",q:"The online library is highly ___ because students can read e-books anytime.",zh:"線上圖書館隨時可用，非常容易取得。",o:["accessible","anesthetic","finite","luxurious"],a:0,why:"anytime、不用到學校 → accessible；搭配 be accessible to everyone。"},
 {t:"quiz",q:"The doctor advised him to carefully control the daily ___ of his medication.",zh:"醫生要他控制每日的藥物劑量。",o:["dosage","charter","equation","formula"],a:0,why:"藥物的量 → dosage；formula 是公式、配方。"},
 {t:"quiz",q:"It was a remarkable ___ that the two childhood friends happened to meet at an airport.",zh:"兩個兒時好友碰巧在機場相遇，真是巧合。",o:["coincidence","breakthrough","reminder","preference"],a:0,why:"happened to meet 碰巧 → coincidence；by coincidence 碰巧。"},
 {t:"quiz",q:"Scientists spent years trying to solve the strange weather ___ that caused snow in the tropics.",zh:"科學家花了好幾年研究這個奇特的天氣現象。",o:["phenomenon","precision","atmosphere","controversy"],a:0,why:"weather phenomenon 天氣現象；複數是 phenomena。"},
 {t:"quiz",q:"The lawyer presented such a(n) ___ argument that even the skeptical jury was convinced.",zh:"律師的論點很有說服力，連陪審團都被說服。",o:["compelling","appalling","exhilarating","fascinating"],a:0,why:"were convinced → compelling 有說服力的。"},
 {t:"quiz",q:"The hikers managed to ___ the harsh conditions until they reached the shelter.",zh:"登山客撐過惡劣環境直到抵達避難所。",o:["endure","compromise","undergo","absorb"],a:0,why:"忍受惡劣環境 → endure；undergo 是 undergo surgery 接受手術。"},

 {t:"quiz",q:"The researchers gained valuable ___ into why young people spend so much time on social media.",zh:"研究人員對年輕人為何常用社群媒體有了深入了解。",o:["insight","session","implication","mindset"],a:0,why:"gain insight into… 深入了解…，注意介系詞 into。"},

 {t:"quiz",q:"The rescue dog followed the hiker's ___ through the forest by detecting the smell.",zh:"搜救犬循著登山客的氣味穿越森林。",o:["scent","sensor","surgeon","sighting"],a:0,why:"smell 是線索 → scent 氣味。"},
 {t:"quiz",q:"The ambulance arrived ___ after the emergency call was made.",zh:"打完緊急電話後，救護車迅速抵達。",o:["promptly","occasionally","conversely","slightly"],a:0,why:"Within minutes 是線索 → promptly 迅速地。"},

function pcQ(p,type){
 const tail=" — 「"+p.part+"」";let o,a=0,q,step;
 if(type==="who"){q=p.s+tail+"真正的主角是？";o=[p.who].concat(p.whoX);step="步驟②：還原分詞的主詞（誰做的／誰被…）"}
 else if(type==="pv"){q=p.s+tail+"是主動還是被動？";o=["主動 → 用 V-ing","被動 → 用 p.p."];a=p.pv==="主動"?0:1;step="步驟②：主角是「自己做」還是「被…」？"}
 else if(type==="lg"){q=p.s+tail+"和主句是什麼關係？";o=p.lgOpts||[p.lg].concat(shuffle(PC_LG.filter(x=>x!==p.lg)).slice(0,3));step="步驟③：兩件事是先後、因果、條件，還是同時？"}
 else{q=p.s+" — 還原成完整句子，哪個對？";o=[p.rest].concat(p.restX);step="步驟④：代入 because / when / if / and 驗證"}
 return {t:"quiz",pc:1,exam:"🧩 分詞構句暖身｜"+p.src,q:q,zh:step,o:o,a:a,sp:p.s,full:p.s,why:p.why+"<br>🈶 "+p.zh}}
function pcWarm(){try{save.pcs=save.pcs||{};
 const ks=shuffle(PC.map((p,i)=>i)).sort((x,y)=>(save.pcs[x]||0)-(save.pcs[y]||0)),k=ks[0],p=PC[k];
 const types=(p.who?["who"]:[]).concat(["pv","lg","rest"]);const n=save.pcs[k]||0;save.pcs[k]=n+1;store();

// ===== 日漫風音效與特效 =====
function T(fn){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();fn(ac.currentTime)}catch(e){}}
function osc(type,f0,f1,t,d,a){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(a,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05)}
function noise(t,d,a,f0,f1){const b=ac.createBuffer(1,Math.ceil(ac.sampleRate*d),ac.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;
 const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type="bandpass";f.Q.value=1.5;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);
 const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(a,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);s.stop(t+d)}

 for(const p of pref){const v=vs.find(v=>p.test(v.name));if(v){VOICE=v;return}}VOICE=vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0]||null}catch(e){}}

  document.getElementById("cheer").textContent=combo>=3?`🔥 ${combo} 連擊！`:CHEER[Math.floor(Math.random()*CHEER.length)];
  if(combo%3===0)rain(["✦","✧","⭐"]);if(it.wd)setTimeout(()=>it.kind==="listen"?sayWord(it.wd.w):speak(it.wd.ex,.95),350);
  const full=it.full||it.q.replace("___",it.o[it.a].split(" … ")[0]).replace("___",(it.o[it.a].split(" … ")[1]||""));
  document.getElementById("after").innerHTML=`${it.wd?`<div class="mini">${sylTiles(it.wd)}<div class="zh">[${esc(it.wd.kk)}]</div></div>`:""}<div class="why">💡 ${it.why}</div><button onclick="speak('${full.replace(/'/g,"\\'")}')" class="btn alt">🔊 ${it.kind==="listen"?"再聽一次":it.kind==="chunk"?"聽整串搭配":"聽完整句子"}</button><button class="btn" onclick="next()">下一個 👉</button>`;
 }else{b.classList.add("no");sNO();combo=0;
  document.getElementById("cheer").textContent=SOFT[Math.floor(Math.random()*SOFT.length)];
  if(firstTry&&!it.again){queue.push(Object.assign({},it,{again:true}))}
  firstTry=false}}
function next(){SFX.whoosh();pos++;show()}

// ===== 過關 =====
function win(){save.done[L]=true;save.stars+=5;store();upStars();sWIN();rain(["✦","✧","❀","🤍","✦"]);
 const nx=L+1<LEVELS.length&&(LEVELS[L+1].exam||1)===(LEVELS[L].exam||1);setTimeout(()=>burst("LEVEL CLEAR!!",1),150);
 app.innerHTML=`<div class="box" style="text-align:center"><div class="winimg"><img src="${ART}" alt=""></div><div class="orn">✦ ✧ ✦</div><div class="ttl">${LEVELS[L].em} ${LEVELS[L].name} 過關！</div>
 <div style="font-size:20px">「${LEVELS[L].name}」你全部搞定了 ✨<br>獎勵 ⭐ +5</div>
 ${nx?`<button class="btn" onclick="start(${L+1})">下一關：${LEVELS[L+1].em} ${LEVELS[L+1].name} 👉</button>`:`<div class="tip" style="margin-top:18px">🎊 這一區全部破關！段考加油，你一定可以！</div>`}
 <button class="btn alt" onclick="home()">回到地圖 🗺️</button></div>`}
try{document.getElementById("spd").textContent=(RATE<.9?"🐢":RATE<1.1?"🔊":"🐇")+" "+RATE.toFixed(2).replace(/0$/,"")+"×"}catch(e){}
home();
</script>
