<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>段考考點闖關</title>
<style>
:root{--bg:#fdf8f0;--card:#ffffff;--ink:#2b2b3a;--soft:#7a7a8c;--line:#ece4d6;--ok:#2fb36d;--no:#f0a04b;
--a:#ffd6e0;--b:#d4ecff;--c:#dff5d8;--d:#fff0c2;--e:#eadcff;}
@media (prefers-color-scheme:dark){:root{--bg:#1d1d27;--card:#2a2a38;--ink:#f3f1ea;--soft:#a9a9bb;--line:#3a3a4c;
--a:#6b3a4a;--b:#2f4a66;--c:#35553a;--d:#5e5230;--e:#4a3d66;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:20px;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:28px;margin:8px 0 4px;text-align:center}
.sub{text-align:center;color:var(--soft);font-size:16px;margin-bottom:18px}
.stars{position:fixed;top:10px;right:12px;background:var(--card);border:2px solid var(--line);border-radius:30px;padding:4px 14px;font-weight:700;z-index:5}
.map{display:grid;gap:14px}
.lv{display:flex;align-items:center;gap:14px;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .15s}
.lv:active{transform:scale(.97)}
.lv .em{font-size:40px}
.lv .nm{font-weight:800;font-size:21px}
.lv .ds{font-size:15px;color:var(--soft)}
.lv .ck{margin-left:auto;font-size:28px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:none;background:var(--card);border:2px solid var(--line);border-radius:14px;font-size:18px;padding:6px 12px;color:var(--ink);cursor:pointer}
.bar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ab5,#ffcf5c,#6fd38f);border-radius:10px;transition:width .4s}
.box{background:var(--card);border-radius:26px;padding:22px 20px;border:3px solid var(--line);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.tag{display:inline-block;font-size:15px;padding:2px 12px;border-radius:20px;background:var(--d);margin-bottom:8px}
.ttl{font-size:25px;font-weight:800;margin:4px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
.chip{padding:8px 14px;border-radius:16px;font-weight:700;font-size:19px;opacity:0;animation:in .4s forwards}
.chip.ar{background:none;padding:0 2px;font-size:22px}
.k-a{background:var(--a)}.k-b{background:var(--b)}.k-c{background:var(--c)}.k-d{background:var(--d)}.k-e{background:var(--e)}
@keyframes in{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.row{width:100%;height:0}
.tip{background:var(--d);border-radius:18px;padding:12px 16px;margin:10px 0 16px;font-size:19px}
.ex{border-left:6px solid #ffb3c6;padding:6px 0 6px 14px;margin:12px 0;font-size:20px}
.zh{color:var(--soft);font-size:17px;margin-top:4px}
.key{display:inline-block;background:#ffcf5c;color:#3a2a00;border-radius:10px;padding:0 10px;cursor:pointer;font-weight:800;animation:wig 1.6s infinite}
.key.open{animation:none;background:#c9f2d6;color:#123a20}
@keyframes wig{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) scale(1.05)}}
.say{border:none;background:var(--b);border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;vertical-align:middle;margin-left:6px}
.btn{display:block;width:100%;margin-top:18px;border:none;border-radius:20px;padding:16px;font-size:21px;font-weight:800;background:#ff8fab;color:#fff;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.98)}
.q{font-size:21px;font-weight:700;margin:6px 0}
.blank{display:inline-block;min-width:70px;border-bottom:3px dashed #ff8fab;text-align:center;color:#e0567a}
.opts{display:grid;gap:12px;margin-top:16px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:14px;font-size:20px;text-align:left;cursor:pointer;color:var(--ink);font-family:inherit}
.opt.ok{border-color:var(--ok);background:#d9f7e5;color:#123a20}
.opt.no{border-color:var(--no);opacity:.45;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.why{margin-top:14px;background:#e9f9ef;color:#123a20;border-radius:18px;padding:12px 16px;font-size:18px;animation:pop .3s}
.cheer{text-align:center;font-size:24px;font-weight:800;margin-top:10px;min-height:34px}
.again{font-size:14px;background:var(--e);border-radius:12px;padding:2px 10px;margin-left:6px}
.big{font-size:70px;text-align:center;animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translateY(-12px)}}
.fx{position:fixed;top:-40px;font-size:30px;pointer-events:none;animation:fall 1.6s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="stars" id="stars">⭐ 0</div>
<div class="wrap" id="app"></div>
<script>
// ===== 內容：一張卡一個重點；[[ ]] 是點了才出現的關鍵字 =====
const LEVELS=[
{name:"it 替身",em:"🧩",ds:"虛受詞 it、seem 的兩種寫法",items:[
 {t:"card",tag:"L1・Review 1",title:"it 先幫忙佔位子",chips:[["S + find / think / consider","a"],["it","e"],["adj. / N","b"],["(for sb.)","d"],["to V","c"]],
  tip:"🔑 it 是替身，真正的主角（to V）在最後面才出場。",ex:"Some people [[find it challenging to]] master English.",zh:"有些人覺得要精通英文很有挑戰性。"},
 {t:"quiz",q:"I still find it difficult ___ along a curb.",zh:"我還是覺得沿著路邊停車很難。",o:["to park","parking","that park","with parking"],a:0,why:"find it + adj. + to V，主角要用 to V。"},
 {t:"quiz",q:"Emma considers ___ a blessing to have Midnight by her bedside.",zh:"Emma 覺得有 Midnight 陪在床邊是一種福氣。",o:["it","them","so","what"],a:0,why:"it 先佔位子，代替後面的 to have Midnight…。"},
 {t:"card",tag:"L1 句型",title:"seem：看起來…",chips:[["It seems that + 現在式","b"],["→","ar"],["S seems to V","c"],["row",""],["It seems that + 過去／完成","a"],["→","ar"],["S seems to have p.p.","e"]],
  tip:"🔑 事情比「看起來」還早發生 → 用 to have p.p.",ex:"It seems that he lost his key. = He [[seems to have lost]] his key.",zh:"他似乎把鑰匙弄丟了。"},
 {t:"quiz",q:"It seems that he was brought up abroad. = He seems ___ abroad.",zh:"他似乎是在國外長大的。",o:["to have been brought up","to be brought up","to bring up","bringing up"],a:0,why:"was brought up 比 seems 早，而且是被動 → to have been p.p.。"},
 {t:"quiz",q:"It seemed that Ken had lost the courage. = Ken ___ the courage.",zh:"Ken 當時似乎已經失去了勇氣。",o:["seemed to have lost","seems to lose","seemed to lose","seems to have lost"],a:0,why:"seemed 是過去，had lost 更早 → seemed to have p.p.。"}
]},
{name:"時間魔法",em:"⏰",ds:"by the time、not…until",items:[
 {t:"card",tag:"L3",title:"by the time：到了…的時候",chips:[["By the time + 過去式","b"],["→","ar"],["had p.p.","a"],["row",""],["By the time + 現在式","b"],["→","ar"],["will have p.p.","c"]],
  tip:"🔑 時間點用「簡單式」，動作用「完成式」。",ex:"By the time I reached the beach, the sun [[had already set]].",zh:"等我到海灘時，太陽已經下山了。"},
 {t:"quiz",q:"By the time you finish your homework, ___.",zh:"等你寫完功課，天就會黑了。",o:["it will have turned dark","it is dark","it had turned dark","it has turned dark"],a:0,why:"finish 是現在式（代表未來）→ will have p.p.。"},
 {t:"quiz",q:"In 1930 we laughed 19 minutes a day, but by 1980 it ___ to six minutes.",zh:"到了 1980 年，已經減少到六分鐘。",o:["had decreased","has been decreasing","was decreasing","should have decreased"],a:0,why:"by + 過去時間（1980）→ had p.p.。"},
 {t:"quiz",q:"By the time Pandora realized something was wrong, she ___ all the troubles.",zh:"等潘朵拉發現不對勁，她早就把災難都放出來了。",o:["had released","has released","would release","released"],a:0,why:"realized 是過去，放出來更早 → had p.p.。"},
 {t:"card",tag:"L2",title:"not…until：直到…才「開始」",chips:[["not + 動作","a"],["until + 時間點","b"],["→","ar"],["那時才開始","c"]],
  tip:"🔑 until 後面是動作的「起點」。放句首要倒裝！",ex:"[[Not until]] you reminded me [[did I realize]] my mistake.",zh:"直到你提醒我，我才發現自己的錯。"},
 {t:"quiz",q:"Not until you reminded me ___ my mistake.",zh:"直到你提醒我，我才發現錯誤。",o:["did I realize","I realized","I did realize","realized I"],a:0,why:"Not until 放句首 → 後面要倒裝：did + I + 原形。"},
 {t:"quiz",q:"The profit didn't tremendously increase ___ the team adopted an innovative approach.",zh:"直到團隊採用創新方法，利潤才大幅增加。",o:["until","since","by the time","while"],a:0,why:"not…until 直到…才開始。"}
]},
{name:"左右對稱",em:"⚖️",ds:"that / those、not only…but also、other",items:[
 {t:"card",tag:"L2",title:"that / those：不重複說",chips:[["單數 N","b"],["→","ar"],["that","a"],["row",""],["複數 N","b"],["→","ar"],["those","c"]],
  tip:"🔑 前面說過的名詞，再出現時換成 that / those。",ex:"The skills needed to manage a team are different from [[those]] needed to sell products.",zh:"管理團隊需要的技能，和賣產品需要的不同。"},
 {t:"quiz",q:"Schools in the north are better equipped, while ___ in the south are relatively poor.",zh:"北部的學校設備較好，南部的則相對較差。",o:["those","they","ones","what"],a:0,why:"代替複數 schools → those。"},
 {t:"quiz",q:"Their scores were almost as high as ___ of the regular students.",zh:"他們的分數幾乎和普通班一樣高。",o:["those","that","the one","it"],a:0,why:"scores 是複數，後面有 of → those。"},
 {t:"card",tag:"L3",title:"not only A but also B",chips:[["A、B 長一樣","c"],["動詞看 B","a"],["Not only 放句首 → 倒裝","e"]],
  tip:"🔑 動詞跟著「後面那個」走。",ex:"[[Not only had I]] let her down, [[but I had also]] broken her heart.",zh:"我不僅讓她失望，還傷了她的心。"},
 {t:"quiz",q:"Not only the Ministry of Education but also the Ministry of Labor ___ responsible.",zh:"不只教育部，勞動部也有責任。",o:["is","are","be","being"],a:0,why:"動詞看 B（the Ministry of Labor 單數）→ is。"},
 {t:"quiz",q:"Both the Ministry of Education and the Ministry of Labor ___ responsible.",zh:"教育部和勞動部都有責任。",o:["are","is","be","was"],a:0,why:"both A and B 一定是複數 → are。"},
 {t:"quiz",q:"Not only children but also almost every adult ___ over-reliant on electronic devices.",zh:"不只孩童，幾乎每個大人都過度依賴電子產品。",o:["is","are","were","be"],a:0,why:"看 B：every adult 是單數 → is。"},
 {t:"quiz",q:"I can't find my ___ shoe.",zh:"我找不到我的另一隻鞋。",o:["other","another","others","the others"],a:0,why:"一雙只有兩隻，剩下那隻 = the other；前面有 my 就不加 the。"}
]},
{name:"分詞變身",em:"🏃",ds:"分詞構句、分詞片語、形容詞或副詞",items:[
 {t:"card",tag:"L3",title:"分詞構句：句子變短",chips:[["主動","b"],["→","ar"],["V-ing","c"],["row",""],["被動","b"],["→","ar"],["p.p.","a"],["row",""],["先做完","b"],["→","ar"],["Having p.p.","e"],["row",""],["主詞不同","b"],["→","ar"],["主詞留著","d"]],
  tip:"🔑 先問：主詞是「自己做」還是「被…」？",ex:"[[Realizing]] that she was frightened, John said quickly, “I'm here to help.”",zh:"John 發現她嚇到了，趕緊說：「我是來幫忙的。」"},
 {t:"quiz",q:"___ with the service, Samuel decided to write a letter of compliments.",zh:"對服務很滿意，Samuel 決定寫一封感謝信。",o:["Pleased","Please","Pleasing","To please"],a:0,why:"Samuel 是「被取悅」→ 被動 p.p.。"},
 {t:"quiz",q:"___ from the back or from the side, the palace was perfectly designed.",zh:"不論從後面或側面看，宮殿都設計得很完美。",o:["Observed","Observe","Observing","To observe"],a:0,why:"宮殿是「被看」→ 被動 p.p.。"},
 {t:"quiz",q:"Which sentence is WRONG?",zh:"找出錯誤的句子。",o:["Although being unemployed, life must go on.","Jay wrote Patty a letter, thanking her.","Having completed the book, the writer took a month off.","It was because of her encouragement that I went abroad."],a:0,why:"失業的是「我」，不是 life，主詞不同不能省 → Although I am unemployed。"},
 {t:"card",tag:"Review 1",title:"分詞片語：形容名詞",chips:[["N","d"],["+ V-ing","c"],["（主動）","b"],["row",""],["N","d"],["+ p.p.","a"],["（被動）","b"]],
  tip:"🔑 把 which is / that are 拿掉就變身完成。",ex:"One was a pile of beef [[hidden]] inside a bull's stomach.",zh:"一堆是藏在牛胃裡的牛肉。"},
 {t:"quiz",q:"A project ___ on 3D printing has been launched.",zh:"一個依靠 3D 列印的計畫已經啟動。",o:["relying","relied","rely","to be relied"],a:0,why:"計畫「依靠」是主動 → V-ing。"},
 {t:"quiz",q:"When she opened the box ___ all manner of misery, evils flew out.",zh:"當她打開裝滿各種苦難的盒子…",o:["containing","contain","contained","to contain"],a:0,why:"盒子「裝著」是主動 → which contained → containing。"},
 {t:"card",tag:"L3",title:"形容詞 or 副詞？",chips:[["補上 Being 通順","b"],["→","ar"],["形容詞","a"],["row",""],["描述動作／整句","b"],["→","ar"],["副詞 -ly","c"]],
  tip:"🔑 在說「誰的心情」用形容詞；在說「怎麼做」用副詞。",ex:"[[Angry]] about being tricked, Zeus took fire away.",zh:"宙斯因為被騙而生氣，把火拿走了。"},
 {t:"quiz",q:"___, Victor told his story after having a cup of tea.",zh:"喝完茶後，Victor 慢慢地說出他的故事。",o:["Slowly","Slow"],a:0,why:"在說「怎麼說」→ 副詞。"},
 {t:"quiz",q:"Not ___, new mothers often suffer from depression.",zh:"不出所料，新手媽媽常有憂鬱症。",o:["surprisingly","surprising"],a:0,why:"修飾整個句子 → 副詞。"}
]},
{name:"小句型寶箱",em:"🔧",ds:"out-、of+N、have no choice、end up、dress",items:[
 {t:"card",tag:"L2",title:"out- 開頭 = 勝過",chips:[["outlive","c"],["outshine","c"],["outsell","c"],["outnumber","c"],["row",""],["⚠ outsource 外包","a"],["⚠ outsider 局外人","a"]],
  tip:"🔑 「比…更 ~」可以改成 out + 動詞。",ex:"Women live longer than men. = Women [[outlive]] men.",zh:"女性比男性長壽。"},
 {t:"quiz",q:"我們寡不敵眾。= We were ___.",zh:"人數被對方勝過",o:["outnumbered","outsourced","outgrown","outsiders"],a:0,why:"人數被勝過 → be outnumbered。"},
 {t:"card",tag:"L2",title:"of / with + 名詞",chips:[["of + N","b"],["=","ar"],["形容詞","a"],["row",""],["with + N","b"],["=","ar"],["副詞","c"]],
  tip:"🔑 of great significance = very significant；with ease = easily",ex:"Liam can buy a house [[with relative ease]].",zh:"Liam 可以相當輕鬆地買房子。"},
 {t:"quiz",q:"This discovery is ___ great importance.",zh:"這個發現非常重要。",o:["of","with","in","for"],a:0,why:"of + N = adj. → of great importance = very important。"},
 {t:"card",tag:"L1",title:"沒辦法，只好…",chips:[["have no choice","a"],["but","d"],["to V","c"]],
  tip:"🔑 but 在這裡是「除了」，後面接 to V。",ex:"I [[had no choice but to]] give up this opportunity.",zh:"我不得已只好放棄這次機會。"},
 {t:"quiz",q:"The politician had no choice but ___ what he had done.",zh:"那位政治人物別無選擇，只能承認。",o:["to admit","admitting","admitted","admit to"],a:0,why:"have no choice but + to V。"},
 {t:"card",tag:"L3",title:"end up：最後變成…",chips:[["end up with","c"],["＋東西／結果","d"],["row",""],["end up as","b"],["＋身分","d"],["row",""],["end up like","a"],["＋某人","d"]],
  tip:"🔑 想像故事的「結局」。",ex:"Instead, he ended up [[with]] nothing but bones.",zh:"結果他最後只拿到骨頭。"},
 {t:"quiz",q:"I don't want to end up ___ my parents, fighting over trifles every day.",zh:"我不想最後變得跟爸媽一樣，每天為小事吵架。",o:["like","with","as","to"],a:0,why:"變得跟某人一樣 → end up like。"},
 {t:"card",tag:"L1",title:"穿著打扮",chips:[["dress sb in","b"],["替人穿"],["row",""],["be dressed in","c"],["穿著"],["row",""],["dress up as","a"],["打扮成"]],
  tip:"🔑 in 後面接衣服或顏色，as 後面接角色。",ex:"I would [[dress up as]] Ronald McDonald.",zh:"我會打扮成麥當勞叔叔。"},
 {t:"quiz",q:"At the costume party, she ___ as a princess.",zh:"在化裝舞會上，她打扮成公主。",o:["dressed up","was dressed in","dressed in","wore"],a:0,why:"打扮成某角色 → dress up as。"},
 {t:"quiz",q:"His little brother would have no one to play ___.",zh:"他弟弟就沒有人可以一起玩了。",o:["with","to","for","（不用填）"],a:0,why:"play with no one → 介系詞 with 不能掉！"}
]},
{name:"單字片語衝刺",em:"🌟",ds:"段考常考搭配",items:[
 {t:"card",tag:"L1",title:"L1 搭配詞",chips:[["suffer from 罹患","a"],["be confined to 離不開","b"],["burst into laughter 哄堂大笑","c"],["in fright 嚇得","d"],["pass away 過世","e"],["turn…down 拒絕","a"]],
  tip:"🔑 每個積木都可以點下面的 🔊 聽一次。",ex:"He [[was confined to]] a wheelchair for months.",zh:"他好幾個月都離不開輪椅。"},
 {t:"quiz",q:"Cats are crucial sources of support for ___ patients in their final stages of life.",zh:"貓是末期病人重要的支持來源。",o:["terminal","corporate","elementary","heartfelt"],a:0,why:"final stages 是線索 → terminal 末期的。"},
 {t:"quiz",q:"Her presence ___ smiles and conversations.",zh:"她的出現引發了笑容和談話。",o:["prompts","confides","contacts","stretches"],a:0,why:"prompt 促使、引發。"},
 {t:"quiz",q:"They screamed and ran away in ___.",zh:"他們尖叫著嚇得逃跑。",o:["fright","frighten","frightened","frightening"],a:0,why:"in + 名詞 → in fright。"},
 {t:"quiz",q:"Shy patients often show ___ in expressing their emotions.",zh:"害羞的病人表達情緒時常常猶豫。",o:["hesitation","texture","empathy","exploration"],a:0,why:"show hesitation 表現出猶豫。"},
 {t:"card",tag:"L2・L3",title:"L2・L3 搭配詞",chips:[["be capable of 有能力","b"],["rely heavily on 高度依賴","c"],["come into conflict with 起衝突","a"],["benefit from 獲益","d"],["fall victim to 成為受害者","e"],["be furious at 對…生氣","a"]],
  tip:"🔑 介系詞跟單字是好朋友，要一起背。",ex:"Zeus [[tortured]] Prometheus by having an eagle feed on his liver.",zh:"宙斯讓老鷹啄食普羅米修斯的肝來折磨他。"},
 {t:"quiz",q:"He ___ Prometheus by tying him to a rock and having an eagle feed on his liver.",zh:"他把普羅米修斯綁在石頭上折磨他。",o:["tortured","banished","mentioned","slaughtered"],a:0,why:"普羅米修斯還活著、一直受苦 → torture 折磨。"},
 {t:"quiz",q:"Ancient Egypt was one of the most powerful ancient ___.",zh:"古埃及是最強大的古文明之一。",o:["civilizations","civilization","civilize","civil"],a:0,why:"one of the + 複數名詞。"},
 {t:"quiz",q:"Another ___ suggestion is that organizations should emphasize skill development.",zh:"另一個有建設性的建議是…",o:["constructive","frail","upright","artificial"],a:0,why:"constructive suggestion 有建設性的建議。"},
 {t:"card",tag:"片語",title:"段考片語（翻譯必考）",chips:[["be about to 正要","a"],["make a difference 有影響","b"],["get down to 開始做","c"],["in charge of 負責","d"],["map out 詳細規劃","e"],["set the stage for 為…鋪路","a"],["run out of 用完","b"],["make up for 彌補","c"],["build on 以…為基礎","d"]],
  tip:"🔑 這些都是段考翻譯題的答案！",ex:"I believed I could [[build on]] my years of experience.",zh:"我相信我能以多年經驗為基礎。"},
 {t:"quiz",q:"As I ___ leave the office last night, my boss called me.",zh:"昨晚我正要離開辦公室時…",o:["was about to","was able to","was used to","was likely to"],a:0,why:"be about to 正要、即將。"},
 {t:"quiz",q:"The government has ___ ways to tackle inflation.",zh:"政府已經用完了對付通膨的辦法。",o:["run out of","made up for","set the stage for","fallen victim to"],a:0,why:"run out of 用完。"},
 {t:"quiz",q:"The team is ready to ___ executing the tasks.",zh:"團隊準備好開始著手執行任務。",o:["get down to","pass away","turn down","cheer up"],a:0,why:"get down to + V-ing 開始做某事。"},
 {t:"quiz",q:"Sam asked Ada out, but she ___ him ___.",zh:"Sam 約 Ada，但她拒絕了他。",o:["turned … down","cheered … up","passed … on","figured … out"],a:0,why:"turn sb down 拒絕某人。"}
]}
];

// ===== 狀態 =====
const KEY="b3l13_quest";
let save={stars:0,done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)save=s}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
let L=null,queue=[],pos=0,combo=0,firstTry=true;
const app=document.getElementById("app");
const CHEER=["太強了！🎉","答對！你超棒 ✨","完美！💯","耶～就是這樣！🥳","腦袋好清楚！🧠","連擊中！🔥"];
const SOFT=["沒關係，再看一次 💪","差一點點！再試試 🌱","慢慢來，你可以的 😊"];

// ===== 音效（不用檔案） =====
let ac;
function tone(fs,d=.12){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;
 fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f;
 g.gain.setValueAtTime(.18,t+i*d);g.gain.exponentialRampToValueAtTime(.001,t+i*d+d*1.8);o.connect(g);g.connect(ac.destination);o.start(t+i*d);o.stop(t+i*d+d*2)})}catch(e){}}
const sOK=()=>tone([660,880,1175]),sNO=()=>tone([330,294],.15),sWIN=()=>tone([523,659,784,1047,1319],.11),sTap=()=>tone([880],.06);
function speak(txt){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt.replace(/\[\[|\]\]/g,"").replace(/___/g,"blank"));u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function rain(em){for(let i=0;i<14;i++){const d=document.createElement("div");d.className="fx";d.textContent=em[i%em.length];
 d.style.left=Math.random()*95+"vw";d.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}}
function upStars(){document.getElementById("stars").textContent="⭐ "+save.stars}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

// ===== 首頁地圖 =====
function home(){L=null;upStars();
 app.innerHTML=`<h1>📚 段考考點闖關</h1><div class="sub">B3 L1～L3・Review 1｜一次一關，全部用點的</div><div class="map">`+
 LEVELS.map((l,i)=>`<button class="lv" onclick="start(${i})"><span class="em">${l.em}</span><span><div class="nm">第 ${i+1} 關｜${l.name}</div><div class="ds">${l.ds}</div></span><span class="ck">${save.done[i]?"🏅":"▶️"}</span></button>`).join("")+`</div>`}

function start(i){sTap();L=i;queue=LEVELS[i].items.map(x=>Object.assign({},x));pos=0;combo=0;show()}

function topbar(){const pct=Math.round(pos/queue.length*100);
 return `<div class="top"><button class="back" onclick="home()">🏠</button><div class="bar"><i style="width:${pct}%"></i></div><span style="font-size:16px">${pos}/${queue.length}</span></div>`}

function show(){if(pos>=queue.length)return win();
 const it=queue[pos];firstTry=true;window.scrollTo(0,0);
 it.t==="card"?card(it):quiz(it)}

// ===== 重點卡 =====
function card(it){let d=0;
 const chips=it.chips.map(c=>c[0]==="row"?'<div class="row"></div>':`<span class="chip ${c[1]==="ar"?"ar":"k-"+(c[1]||"d")}" style="animation-delay:${(d++)*.18}s">${esc(c[0])}</span>`).join("");
 const ex=esc(it.ex).replace(/\[\[(.+?)\]\]/g,(m,k)=>`<span class="key" data-k="${k}" onclick="reveal(this)">👆 點我</span>`);
 app.innerHTML=topbar()+`<div class="box"><span class="tag">${it.tag}</span><div class="ttl">${it.title}</div><div class="chips">${chips}</div>
 <div class="tip">${it.tip}</div><div class="ex">${ex}<button class="say" onclick="speak(queue[pos].ex)">🔊</button><div class="zh">${it.zh}</div></div>
 <button class="btn" onclick="next()">我懂了 👉</button></div>`}
function reveal(el){sTap();el.textContent=el.dataset.k;el.classList.add("open")}

// ===== 點選題 =====
function quiz(it){
 const order=it.o.map((x,i)=>i).sort(()=>Math.random()-.5);
 const q=esc(it.q).replace("___",'<span class="blank">?</span>').replace("___",'<span class="blank">?</span>');
 app.innerHTML=topbar()+`<div class="box"><span class="tag">練習一下${it.again?'<span class="again">再見一次</span>':""}</span>
 <div class="q">${q} <button class="say" onclick="speak(queue[pos].q)">🔊</button></div><div class="zh">${it.zh}</div>
 <div class="opts">${order.map(i=>`<button class="opt" data-i="${i}" onclick="pick(this)">${esc(it.o[i])}</button>`).join("")}</div>
 <div class="cheer" id="cheer"></div><div id="after"></div></div>`}
function pick(b){const it=queue[pos],i=+b.dataset.i;
 if(b.classList.contains("no")||document.querySelector(".opt.ok"))return;
 if(i===it.a){b.classList.add("ok");sOK();combo++;save.stars+=firstTry?2:1;upStars();store();
  document.getElementById("cheer").textContent=combo>=3?`🔥 ${combo} 連擊！`:CHEER[Math.floor(Math.random()*CHEER.length)];
  if(combo%3===0)rain(["⭐","✨","🎉"]);
  const full=it.q.replace("___",it.o[it.a].split(" … ")[0]).replace("___",(it.o[it.a].split(" … ")[1]||""));
  document.getElementById("after").innerHTML=`<div class="why">💡 ${it.why}</div><button class="btn" onclick="speak('${full.replace(/'/g,"\\'")}')" style="background:#8ec5ff">🔊 聽完整句子</button><button class="btn" onclick="next()">下一個 👉</button>`;
 }else{b.classList.add("no");sNO();combo=0;
  document.getElementById("cheer").textContent=SOFT[Math.floor(Math.random()*SOFT.length)];
  if(firstTry&&!it.again){queue.push(Object.assign({},it,{again:true}))}
  firstTry=false}}
function next(){sTap();pos++;show()}

// ===== 過關 =====
function win(){save.done[L]=true;save.stars+=5;store();upStars();sWIN();rain(["🏅","⭐","🎉","💖"]);
 const nx=L+1<LEVELS.length;
 app.innerHTML=`<div class="box" style="text-align:center"><div class="big">🏅</div><div class="ttl">第 ${L+1} 關 過關！</div>
 <div style="font-size:20px">「${LEVELS[L].name}」你全部搞定了 ✨<br>獎勵 ⭐ +5</div>
 ${nx?`<button class="btn" onclick="start(${L+1})">下一關：${LEVELS[L+1].em} ${LEVELS[L+1].name} 👉</button>`:`<div class="tip" style="margin-top:18px">🎊 六關全破！段考加油，你一定可以！</div>`}
 <button class="btn" style="background:#b9a8f0" onclick="home()">回到地圖 🗺️</button></div>`}
home();
</script>
</body>
</html>
