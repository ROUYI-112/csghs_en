<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>段考考點闖關</title>
<style>
:root{--bg:#f5efe4;--card:#fffdf8;--ink:#3b3226;--soft:#8a7d6a;--line:#e3d4b8;--gold:#b8955a;--gold2:#8c6d3b;--ok:#6f9a6a;--no:#c9a27a;
--a:#f3e1dc;--b:#e5e8ec;--c:#e3e9d9;--d:#f2e7cc;--e:#ebe3ee;}
@media (prefers-color-scheme:dark){:root{--bg:#211d18;--card:#2c2620;--ink:#f2eadb;--soft:#b8aa92;--line:#4a3f30;--gold:#d2b47a;--gold2:#e2c891;
--a:#4f3a36;--b:#3a3d42;--c:#3c4334;--d:#4b4130;--e:#443a48;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:20px;line-height:1.6;
background:var(--bg) repeating-conic-gradient(from 0deg at 50% -10%,rgba(184,149,90,.07) 0 3deg,transparent 3deg 12deg) fixed}
.serif,h1,.ttl,.nm{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 90px}
.hero{display:flex;align-items:center;gap:16px;margin:20px 0 22px}
.arch{flex:none;width:118px;aspect-ratio:3/4;border-radius:60px 60px 14px 14px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 5px var(--card),0 0 0 6px var(--line),0 10px 26px rgba(140,109,59,.25);background:var(--card)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.hero h1{font-size:28px;margin:0;line-height:1.3;color:var(--gold2)}
.hero .sub{text-align:left;margin:6px 0 0}
.orn{color:var(--gold);letter-spacing:6px;font-size:14px}
.sub{color:var(--soft);font-size:16px}
.stars{position:fixed;top:10px;right:12px;background:var(--card);border:1.5px solid var(--gold);color:var(--gold2);border-radius:30px;padding:4px 14px;font-weight:700;z-index:5}
.map{display:grid;gap:14px}
.sec{margin:14px 0 -2px;font-family:"Noto Serif TC","Songti TC",serif;font-weight:800;color:var(--gold2);font-size:19px;border-bottom:1px solid var(--line);padding-bottom:4px}
.lv{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .15s,border-color .2s;box-shadow:0 4px 14px rgba(140,109,59,.08)}
.lv:hover{border-color:var(--gold)}
.lv:active{transform:scale(.97)}
.lv .em{font-size:36px;width:56px;height:56px;display:grid;place-items:center;border-radius:50%;background:var(--d);border:1.5px solid var(--gold)}
.lv .nm{font-weight:800;font-size:21px}
.lv .ds{font-size:15px;color:var(--soft)}
.lv .ck{margin-left:auto;font-size:26px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:var(--card);border:1.5px solid var(--gold);border-radius:14px;font-size:18px;padding:6px 12px;color:var(--ink);cursor:pointer}
.bar{flex:1;height:14px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e8d6ae,#c9a464,#9b7a43);border-radius:10px;transition:width .4s}
.box{position:relative;background:var(--card);border-radius:26px;padding:24px 20px;border:1.5px solid var(--gold);box-shadow:0 0 0 5px var(--card),0 0 0 6px var(--line),0 12px 30px rgba(140,109,59,.12);animation:pop .35s ease}
.box::before,.box::after{content:"✦";position:absolute;top:10px;color:var(--gold);font-size:16px}
.box::before{left:14px}.box::after{right:14px}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.tag{display:inline-block;font-size:15px;padding:2px 12px;border-radius:20px;border:1px solid var(--gold);color:var(--gold2);margin:0 0 8px 18px}
.ttl{font-size:25px;font-weight:800;margin:4px 0 14px;color:var(--gold2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 16px}
.chip{padding:8px 14px;border-radius:16px;font-weight:700;font-size:19px;opacity:0;animation:in .4s forwards;border:1px solid rgba(140,109,59,.18)}
.chip.ar{background:none;border:none;padding:0 2px;font-size:22px;color:var(--gold)}
.k-a{background:var(--a)}.k-b{background:var(--b)}.k-c{background:var(--c)}.k-d{background:var(--d)}.k-e{background:var(--e)}
@keyframes in{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.row{width:100%;height:0}
.tip{background:var(--d);border-radius:18px;padding:12px 16px;margin:10px 0 16px;font-size:19px;border-left:4px solid var(--gold)}
.ex{border-left:3px solid var(--gold);padding:6px 0 6px 14px;margin:12px 0;font-size:20px}
.zh{color:var(--soft);font-size:17px;margin-top:4px}
.key{display:inline-block;background:linear-gradient(135deg,#f3e3bd,#d9b977);color:#3b2a10;border-radius:10px;padding:0 10px;cursor:pointer;font-weight:800;animation:wig 1.6s infinite}
.key.open{animation:none;background:#e3ecd8;color:#24361f}
@keyframes wig{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) scale(1.05)}}
.say{border:1px solid var(--gold);background:var(--card);border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;vertical-align:middle;margin-left:6px}
.btn{display:block;width:100%;margin-top:18px;border:none;border-radius:20px;padding:16px;font-size:21px;font-weight:800;background:linear-gradient(135deg,#c9a464,#9b7a43);color:#fffaf0;cursor:pointer;font-family:inherit;letter-spacing:1px;box-shadow:0 6px 16px rgba(140,109,59,.25)}
.btn.alt{background:var(--card);color:var(--gold2);border:1.5px solid var(--gold);box-shadow:none}
.btn:active{transform:scale(.98)}
.q{font-size:21px;font-weight:700;margin:6px 0}
.blank{display:inline-block;min-width:70px;border-bottom:3px dashed var(--gold);text-align:center;color:var(--gold2)}
.opts{display:grid;gap:12px;margin-top:16px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:14px;font-size:20px;text-align:left;cursor:pointer;color:var(--ink);font-family:inherit}
.opt:hover{border-color:var(--gold)}
.opt.ok{border-color:var(--ok);background:#e6efdf;color:#24361f}
.opt.no{border-color:var(--no);opacity:.45;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.why{margin-top:14px;background:#f1ecdc;color:#3b3226;border-radius:18px;padding:12px 16px;font-size:18px;animation:pop .3s}
.cheer{text-align:center;font-size:24px;font-weight:800;margin-top:10px;min-height:34px;color:var(--gold2)}
.again{font-size:14px;background:var(--e);border-radius:12px;padding:2px 10px;margin-left:6px}
.winimg{width:min(260px,70vw);margin:4px auto 10px;aspect-ratio:3/4;border-radius:130px 130px 18px 18px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 6px var(--card),0 0 0 7px var(--line),0 0 40px rgba(201,164,100,.55);animation:float 3s ease-in-out infinite}
.winimg img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes float{50%{transform:translateY(-8px)}}
.fx{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:fall 1.8s linear forwards;z-index:9;color:#c9a464}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>

  tip:"🔑 時間點用「簡單式」，動作用「完成式」。",ex:"By the time I reached the beach, the sun [[had already set]].",zh:"等我到海灘時，太陽已經下山了。"},
 {t:"quiz",q:"By the time you finish your homework, ___.",zh:"等你寫完功課，天就會黑了。",o:["it will have turned dark","it is dark","it had turned dark","it has turned dark"],a:0,why:"finish 是現在式（代表未來）→ will have p.p.。"},
 {t:"quiz",q:"In 1930 we laughed 19 minutes a day, but by 1980 it ___ to six minutes.",zh:"到了 1980 年，已經減少到六分鐘。",o:["had decreased","has been decreasing","was decreasing","should have decreased"],a:0,why:"by + 過去時間（1980）→ had p.p.。"},
 {t:"quiz",q:"By the time Pandora realized something was wrong, she ___ all the troubles.",zh:"等潘朵拉發現不對勁，她早就把災難都放出來了。",o:["had released","has released","would release","released"],a:0,why:"realized 是過去，放出來更早 → had p.p.。"},
 {t:"card",tag:"L2",title:"not…until：直到…才「開始」",chips:[["not + 動作","a"],["until + 時間點","b"],["→","ar"],["那時才開始","c"]],
  tip:"🔑 until 後面是動作的「起點」。放句首要倒裝！",ex:"[[Not until]] you reminded me [[did I realize]] my mistake.",zh:"直到你提醒我，我才發現自己的錯。"},
 {t:"quiz",q:"Not until you reminded me ___ my mistake.",zh:"直到你提醒我，我才發現錯誤。",o:["did I realize","I realized","I did realize","realized I"],a:0,why:"Not until 放句首 → 後面要倒裝：did + I + 原形。"},
 {t:"quiz",q:"The profit didn't tremendously increase ___ the team adopted an innovative approach.",zh:"直到團隊採用創新方法，利潤才大幅增加。",o:["until","since","by the time","while"],a:0,why:"not…until 直到…才開始。"}
]},
{name:"左右對稱",em:"⚖️",ds:"that / those、not only…but also、other",items:[
 {t:"card",tag:"L2",title:"that / those：不重複說",chips:[["單數 N","b"],["→","ar"],["that","a"],["row",""],["複數 N","b"],["→","ar"],["those","c"]],
  tip:"🔑 前面說過的名詞，再出現時換成 that / those。",ex:"The skills needed to manage a team are different from [[those]] needed to sell products.",zh:"管理團隊需要的技能，和賣產品需要的不同。"},
 {t:"quiz",q:"Schools in the north are better equipped, while ___ in the south are relatively poor.",zh:"北部的學校設備較好，南部的則相對較差。",o:["those","they","ones","what"],a:0,why:"代替複數 schools → those。"},
 {t:"quiz",q:"Their scores were almost as high as ___ of the regular students.",zh:"他們的分數幾乎和普通班一樣高。",o:["those","that","the one","it"],a:0,why:"scores 是複數，後面有 of → those。"},
 {t:"card",tag:"L3",title:"not only A but also B",chips:[["A、B 長一樣","c"],["動詞看 B","a"],["Not only 放句首 → 倒裝","e"]],
  tip:"🔑 動詞跟著「後面那個」走。",ex:"[[Not only had I]] let her down, [[but I had also]] broken her heart.",zh:"我不僅讓她失望，還傷了她的心。"},
 {t:"quiz",q:"Not only the Ministry of Education but also the Ministry of Labor ___ responsible.",zh:"不只教育部，勞動部也有責任。",o:["is","are","be","being"],a:0,why:"動詞看 B（the Ministry of Labor 單數）→ is。"},
 {t:"quiz",q:"Both the Ministry of Education and the Ministry of Labor ___ responsible.",zh:"教育部和勞動部都有責任。",o:["are","is","be","was"],a:0,why:"both A and B 一定是複數 → are。"},
 {t:"quiz",q:"Not only children but also almost every adult ___ over-reliant on electronic devices.",zh:"不只孩童，幾乎每個大人都過度依賴電子產品。",o:["is","are","were","be"],a:0,why:"看 B：every adult 是單數 → is。"},
 {t:"quiz",q:"I can't find my ___ shoe.",zh:"我找不到我的另一隻鞋。",o:["other","another","others","the others"],a:0,why:"一雙只有兩隻，剩下那隻 = the other；前面有 my 就不加 the。"}
]},
{name:"分詞變身",em:"🏃",ds:"分詞構句、分詞片語、形容詞或副詞",items:[
 {t:"card",tag:"L3",title:"分詞構句：句子變短",chips:[["主動","b"],["→","ar"],["V-ing","c"],["row",""],["被動","b"],["→","ar"],["p.p.","a"],["row",""],["先做完","b"],["→","ar"],["Having p.p.","e"],["row",""],["主詞不同","b"],["→","ar"],["主詞留著","d"]],
  tip:"🔑 先問：主詞是「自己做」還是「被…」？",ex:"[[Realizing]] that she was frightened, John said quickly, “I'm here to help.”",zh:"John 發現她嚇到了，趕緊說：「我是來幫忙的。」"},
 {t:"quiz",q:"___ with the service, Samuel decided to write a letter of compliments.",zh:"對服務很滿意，Samuel 決定寫一封感謝信。",o:["Pleased","Please","Pleasing","To please"],a:0,why:"Samuel 是「被取悅」→ 被動 p.p.。"},
 {t:"quiz",q:"___ from the back or from the side, the palace was perfectly designed.",zh:"不論從後面或側面看，宮殿都設計得很完美。",o:["Observed","Observe","Observing","To observe"],a:0,why:"宮殿是「被看」→ 被動 p.p.。"},
 {t:"quiz",q:"Which sentence is WRONG?",zh:"找出錯誤的句子。",o:["Although being unemployed, life must go on.","Jay wrote Patty a letter, thanking her.","Having completed the book, the writer took a month off.","It was because of her encouragement that I went abroad."],a:0,why:"失業的是「我」，不是 life，主詞不同不能省 → Although I am unemployed。"},
 {t:"card",tag:"Review 1",title:"分詞片語：形容名詞",chips:[["N","d"],["+ V-ing","c"],["（主動）","b"],["row",""],["N","d"],["+ p.p.","a"],["（被動）","b"]],
  tip:"🔑 把 which is / that are 拿掉就變身完成。",ex:"One was a pile of beef [[hidden]] inside a bull's stomach.",zh:"一堆是藏在牛胃裡的牛肉。"},
 {t:"quiz",q:"A project ___ on 3D printing has been launched.",zh:"一個依靠 3D 列印的計畫已經啟動。",o:["relying","relied","rely","to be relied"],a:0,why:"計畫「依靠」是主動 → V-ing。"},
 {t:"quiz",q:"When she opened the box ___ all manner of misery, evils flew out.",zh:"當她打開裝滿各種苦難的盒子…",o:["containing","contain","contained","to contain"],a:0,why:"盒子「裝著」是主動 → which contained → containing。"},
 {t:"card",tag:"L3",title:"形容詞 or 副詞？",chips:[["補上 Being 通順","b"],["→","ar"],["形容詞","a"],["row",""],["描述動作／整句","b"],["→","ar"],["副詞 -ly","c"]],
  tip:"🔑 在說「誰的心情」用形容詞；在說「怎麼做」用副詞。",ex:"[[Angry]] about being tricked, Zeus took fire away.",zh:"宙斯因為被騙而生氣，把火拿走了。"},
 {t:"quiz",q:"___, Victor told his story after having a cup of tea.",zh:"喝完茶後，Victor 慢慢地說出他的故事。",o:["Slowly","Slow"],a:0,why:"在說「怎麼說」→ 副詞。"},
 {t:"quiz",q:"Not ___, new mothers often suffer from depression.",zh:"不出所料，新手媽媽常有憂鬱症。",o:["surprisingly","surprising"],a:0,why:"修飾整個句子 → 副詞。"}
]},
{name:"小句型寶箱",em:"🔧",ds:"out-、of+N、have no choice、end up、dress",items:[

  tip:"🔑 「比…更 ~」可以改成 out + 動詞。",ex:"Women live longer than men. = Women [[outlive]] men.",zh:"女性比男性長壽。"},
 {t:"quiz",q:"我們寡不敵眾。= We were ___.",zh:"人數被對方勝過",o:["outnumbered","outsourced","outgrown","outsiders"],a:0,why:"人數被勝過 → be outnumbered。"},
 {t:"card",tag:"L2",title:"of / with + 名詞",chips:[["of + N","b"],["=","ar"],["形容詞","a"],["row",""],["with + N","b"],["=","ar"],["副詞","c"]],
  tip:"🔑 of great significance = very significant；with ease = easily",ex:"Liam can buy a house [[with relative ease]].",zh:"Liam 可以相當輕鬆地買房子。"},
 {t:"quiz",q:"This discovery is ___ great importance.",zh:"這個發現非常重要。",o:["of","with","in","for"],a:0,why:"of + N = adj. → of great importance = very important。"},
 {t:"card",tag:"L1",title:"沒辦法，只好…",chips:[["have no choice","a"],["but","d"],["to V","c"]],
  tip:"🔑 but 在這裡是「除了」，後面接 to V。",ex:"I [[had no choice but to]] give up this opportunity.",zh:"我不得已只好放棄這次機會。"},
 {t:"quiz",q:"The politician had no choice but ___ what he had done.",zh:"那位政治人物別無選擇，只能承認。",o:["to admit","admitting","admitted","admit to"],a:0,why:"have no choice but + to V。"},
 {t:"card",tag:"L3",title:"end up：最後變成…",chips:[["end up with","c"],["＋東西／結果","d"],["row",""],["end up as","b"],["＋身分","d"],["row",""],["end up like","a"],["＋某人","d"]],
  tip:"🔑 想像故事的「結局」。",ex:"Instead, he ended up [[with]] nothing but bones.",zh:"結果他最後只拿到骨頭。"},
 {t:"quiz",q:"I don't want to end up ___ my parents, fighting over trifles every day.",zh:"我不想最後變得跟爸媽一樣，每天為小事吵架。",o:["like","with","as","to"],a:0,why:"變得跟某人一樣 → end up like。"},
 {t:"card",tag:"L1",title:"穿著打扮",chips:[["dress sb in","b"],["替人穿"],["row",""],["be dressed in","c"],["穿著"],["row",""],["dress up as","a"],["打扮成"]],
  tip:"🔑 in 後面接衣服或顏色，as 後面接角色。",ex:"I would [[dress up as]] Ronald McDonald.",zh:"我會打扮成麥當勞叔叔。"},
 {t:"quiz",q:"At the costume party, she ___ as a princess.",zh:"在化裝舞會上，她打扮成公主。",o:["dressed up","was dressed in","dressed in","wore"],a:0,why:"打扮成某角色 → dress up as。"},
 {t:"quiz",q:"His little brother would have no one to play ___.",zh:"他弟弟就沒有人可以一起玩了。",o:["with","to","for","（不用填）"],a:0,why:"play with no one → 介系詞 with 不能掉！"}
]},

 {t:"quiz",q:"He ___ Prometheus by tying him to a rock and having an eagle feed on his liver.",zh:"他把普羅米修斯綁在石頭上折磨他。",o:["tortured","banished","mentioned","slaughtered"],a:0,why:"普羅米修斯還活著、一直受苦 → torture 折磨。"},

 {t:"quiz",q:"Sam asked Ada out, but she ___ him ___.",zh:"Sam 約 Ada，但她拒絕了他。",o:["turned … down","cheered … up","passed … on","figured … out"],a:0,why:"turn sb down 拒絕某人。"}

{name:"考古題・克漏字",em:"🗝️",sec:"📜 考古題與考卷",ds:"高二上期中考古題 II：文法搭配",items:[

 {t:"card",tag:"考古題 II",title:"連接小幫手",chips:[["whereas","b"],["而（前後對比）","d"],["row",""],["so that","c"],["以便、為了","d"],["row",""],[", which","a"],["補充說明前面的事","d"]],

 {t:"quiz",q:"The tiny flame exploded into a huge fire, ___ forced Māui to turn into a hawk.",zh:"小火焰變成大火，迫使 Māui 變成老鷹。",o:["which","what","it","and"],a:0,why:"逗號後補充說明、缺主詞 → , which。"},

 {t:"quiz",q:"Our puzzles are similar to ___ of classic detective novels.",zh:"我們的謎題就像經典偵探小說裡的謎題。",o:["those","that","what","ones"],a:0,why:"代替複數 puzzles，後面有 of → those。"}
]},

 {t:"quiz",q:"Otherwise, he would be ___ from the village and never allowed to return.",zh:"否則他會被逐出村子、永遠不能回來。",o:["banished","punished","overlooked","criticized"],a:0,why:"never allowed to return → banish 放逐。"},
 {t:"quiz",q:"Stomping her foot ___, she threw the burning toenail at Māui.",zh:"她氣得跺腳，把燃燒的腳趾甲丟向 Māui。",o:["in fury","at risk","in charge","on duty"],a:0,why:"in fury 憤怒地。"},
 {t:"quiz",q:"Thanks to him, people were ___ the knowledge to create fire.",zh:"多虧了他，人們具備了生火的知識。",o:["equipped with","protected from","distributed to","figured out"],a:0,why:"A be equipped with B：A 配備了 B。"},
 {t:"card",tag:"翻譯題",title:"翻譯片語寶箱",chips:[["pass on…to 傳給","a"],["cheer…up 鼓舞","b"],["make a difference 帶來改變","c"],["cost an arm and a leg 超貴","d"],["fall victim to 成為受害者","e"],["get down to 開始著手","a"],["roll up one's sleeves 捲起袖子","b"],["trial and error 反覆試驗","c"],["run out 用完","d"]],
  tip:"🔑 run out 後面沒有受詞；run out of 後面要接東西。",ex:"Whenever the supplies [[ran out]], everyone was willing to pitch in.",zh:"每當物資用完，大家都樂意幫忙。"},
 {t:"quiz",q:"She believed that by ___ her knowledge to others, she could give back to society.",zh:"她相信把知識傳給別人就能回饋社會。",o:["passing on","turning down","making up","figuring out"],a:0,why:"pass on A to B 把 A 傳給 B；by 後面接 V-ing。"},
 {t:"quiz",q:"When the children felt discouraged, she would ___ with words of encouragement.",zh:"孩子沮喪時，她會用鼓勵的話鼓舞他們。",o:["cheer them up","turn them down","pass them on","map them out"],a:0,why:"cheer sb up 使某人振作。"},
 {t:"quiz",q:"Since the tariffs, many imported goods have begun to ___.",zh:"關稅之後，很多進口商品變得超級貴。",o:["cost an arm and a leg","make a difference","run out of","set the stage"],a:0,why:"非常昂貴 → cost an arm and a leg。"},
 {t:"quiz",q:"Whenever the supplies ___, everyone was willing to pitch in.",zh:"每當物資用完，大家都會幫忙。",o:["ran out","ran out of","made up","turned down"],a:0,why:"後面沒有受詞 → ran out（不加 of）。"},
 {t:"card",tag:"Review Quiz",title:"整句翻譯三連發",chips:[["not only A but also B","c"],["→","ar"],["A、B 都用過去式","d"],["row",""],["By the time + 過去式","b"],["→","ar"],["had p.p.","a"],["row",""],["not…until","e"],["→","ar"],["兩邊都用過去式","d"]],
  tip:"🔑 fall victim to 的三態：fall – fell – fallen",ex:"By the time he realized it was a scam, he [[had already fallen]] victim to identity theft.",zh:"等他發現是詐騙時，早就成了身分盜用的受害者。"},
 {t:"quiz",q:"During the pandemic, many people not only came into conflict with their family but also ___ their jobs.",zh:"疫情期間，很多人不只和家人起衝突，還丟了工作。",o:["lost","losing","to lose","lose"],a:0,why:"對仗：came 是過去式，lost 也要過去式。"},
 {t:"quiz",q:"By the time he realized it was a scam, he ___ victim to identity theft.",zh:"等他發現是詐騙時，他早已成了受害者。",o:["had already fallen","fell","has fallen","would fall"],a:0,why:"By the time + 過去式 → had p.p.；fall 的 p.p. 是 fallen。"},
 {t:"quiz",q:"He did not realize it was a scam until he ___ victim to identity theft.",zh:"他直到成了受害者才發現是詐騙。",o:["fell","had fallen","falls","has fallen"],a:0,why:"not…until：until 子句用簡單過去式 fell。"},
 {t:"quiz",q:"直到必須依靠彼此，我們才知道我們有能力一起合作。",zh:"選出正確的翻譯",o:["We didn't know we were capable of working together as a team until we had to rely on one another.","We knew we were capable of working together as a team until we had to rely on one another.","We didn't know we were capable to work together as a team until we had to rely on one another.","We didn't know we were capable of work together as a team until we had to rely on one another."],a:0,why:"not…until 要有 not；be capable of + V-ing（of 是介系詞）；had to rely 是 have to 的過去式，不是過去完成式。"}
]},
{name:"考古題・老師畫重點",em:"🖍️",ds:"考古題 II 詳解裡老師特別標的考點",items:[
 {t:"card",tag:"老師螢光筆",title:"兩個 to 長得一樣，詞性不同",chips:[["consider it + adj. + to V","b"],["→","ar"],["不定詞 to + 原形","c"],["row",""],["dedicate A to + V-ing","a"],["→","ar"],["介系詞 to + V-ing","e"],["row",""],["get down to + V-ing","a"],["→","ar"],["也是介系詞 to","e"]],
  tip:"🔑 老師說這是很好的考點：to 後面要先判斷是「不定詞」還是「介系詞」。",ex:"She [[considered it rewarding to]] dedicate her life [[to teaching]].",zh:"她認為把一生奉獻給教學是值得的。"},
 {t:"quiz",q:"Joyce had considered it rewarding to dedicate her life to ___.",zh:"她曾認為把一生奉獻給教學是值得的。",o:["teaching","teach","taught","be teaching"],a:0,why:"dedicate A to + V-ing，這個 to 是介系詞，不能寫 to teach。"},
 {t:"quiz",q:"Joyce had ___ to dedicate her life to teaching.",zh:"她曾認為奉獻一生給教學是值得的。",o:["considered it rewarding","considered rewarding","considered it reward","considered that rewarding"],a:0,why:"consider + it + adj. + to V：it 先替後面的 to V 佔位子。"},
 {t:"quiz",q:"Some have not only gotten down to ___ the supply chains but also adjusted their structure.",zh:"有些公司不只開始重整供應鏈，也調整了企業結構。",o:["reorganizing","reorganize","reorganized","have reorganized"],a:0,why:"get down to + V-ing，to 是介系詞。"},
 {t:"quiz",q:"Some have not only gotten down to reorganizing the supply chains but also ___ their structure.",zh:"不只…也調整了企業結構。",o:["adjusted","adjusting","to adjust","adjust"],a:0,why:"平行結構：have 同時帶 gotten 和 adjusted 兩個過去分詞。"},
 {t:"quiz",q:"When the children felt discouraged, she would ___ with words of encouragement.",zh:"孩子沮喪時，她會用鼓勵的話鼓舞他們。",o:["cheer them up","cheer up them","cheer they up","cheer up their"],a:0,why:"代名詞當受詞要放中間：cheer them up；不能說 cheer up them。"},
 {t:"quiz",q:"The villagers demanded he ___ out Mahuika, the fire goddess, to get fire.",zh:"村民要求他去找火神 Mahuika 取火。",o:["seek","seeks","sought","seeking"],a:0,why:"老師螢光筆：要命建堅規（demand 要求）→ 子句省略 should，動詞用原形 seek。"},
 {t:"quiz",q:"Why would a dying girl want to hear a speaker? ___, there were so many more exciting things she could do.",zh:"畢竟，她還有那麼多更有趣的事可以做。",o:["After all","Instead","On the contrary","Besides"],a:0,why:"After all 畢竟，用來補充一個說話者認為合理的理由。"},
 {t:"quiz",q:"Although we just met, she ___ her goals before passing to me.",zh:"雖然我們才剛認識，她向我吐露了她的目標。",o:["confided","ensured","ranked","stretched"],a:0,why:"confide sth to sb 向某人吐露（L1 單字）。"},
 {t:"quiz",q:"Try our ___ murder mystery games, a completely new way to gather and play!",zh:"試試我們創新的謀殺推理遊戲，全新的玩法！",o:["innovative","flexible","sociable","intense"],a:0,why:"a completely new way 呼應 innovative 創新的（L2 單字）。"},
 {t:"quiz",q:"___ various themes to choose from, each kit transports you to another time.",zh:"有各種主題可選，每套組都能帶你穿越時空。",o:["With","Despite","As","For"],a:0,why:"With + N + to V：有…可以…。"},
 {t:"quiz",q:"All of our games ___ a thrilling and unforgettable adventure.",zh:"我們所有的遊戲都保證帶來刺激難忘的冒險。",o:["promise","erect","assemble","recommend"],a:0,why:"老師螢光筆：promise + N 保證提供某事；主詞複數用原形。"},
 {t:"quiz",q:"The embers had turned to cold ashes. ___, everyone was filled with great anger.",zh:"如預期一般，每個人都非常憤怒。",o:["As expected","In addition","On the other hand","By doing so"],a:0,why:"火種被熄滅 → 村民生氣是可以預料的 → As expected。"}
]},
{name:"考卷 LT302",em:"🍡",sec:"",ds:"L2 單字、棉花糖挑戰克漏字",items:[
 {t:"card",tag:"LT302・L2",title:"L2 單字總複習",chips:[["promise 承諾","a"],["architect 建築師","b"],["structure 結構","c"],["rank 排名","d"],["feedback 回饋","e"],["collaborate 合作","a"],["adjustment 調整","b"],["route 路線","c"],["exploration 探索","d"],["unique 獨特的","e"],["stability 穩定","a"],["reliable 可信賴的","b"],["slightly 稍微","c"]],
  tip:"🔑 rely 依賴 → reliable 可信賴的（人），reliant 依賴的。",ex:"Bruce is the most [[reliable]] person in this company; you can trust him.",zh:"Bruce 是公司裡最可靠的人，你可以信任他。"},
 {t:"quiz",q:"Tom ___ his daughter that he would take her to the zoo yesterday.",zh:"Tom 答應女兒昨天帶她去動物園。",o:["promised","ranked","adjusted","explored"],a:0,why:"promise sb that… 答應某人…。"},
 {t:"quiz",q:"According to a report, Finland is ___ the happiest country in the world.",zh:"根據報告，芬蘭被評為世界上最快樂的國家。",o:["ranked","promised","constructed","relied"],a:0,why:"be ranked + 名次 被排名為…。"},
 {t:"quiz",q:"I feel ___ dizzy. It's not a serious problem.",zh:"我覺得有點頭暈，不嚴重。",o:["slightly","slight","greatly","terribly"],a:0,why:"不嚴重 → slightly 稍微；修飾形容詞要用副詞。"},
 {t:"quiz",q:"Wujec's hope is ___ companies around the world will use the challenge.",zh:"Wujec 希望全世界的公司都會使用這個挑戰。",o:["that","this","which","where"],a:0,why:"be 動詞後接完整句子 → 名詞子句 that。"},
 {t:"quiz",q:"The rules of the challenge are simpler than ___ of many other games.",zh:"這個挑戰的規則比很多遊戲的規則簡單。",o:["those","this","these","that"],a:0,why:"代替複數 rules，後面有 of → those。"},
 {t:"quiz",q:"The challenge is ___ complete ___ the team places the marshmallow on top.",zh:"直到把棉花糖放上去，挑戰才算完成。",o:["not; until","as; as","so; that","not; but"],a:0,why:"not…until 直到…才。"},
 {t:"quiz",q:"The Marshmallow Challenge ___ a number of times in the past few years.",zh:"棉花糖挑戰過去幾年已經舉辦過好幾次。",o:["has been held","has held","had held","has been holding"],a:0,why:"in the past few years → 現在完成式；比賽是「被舉辦」→ 被動。"},
 {t:"quiz",q:"___ previous challenges, Wujec has divided up his teams based on profession this time.",zh:"不同於以往的挑戰，這次依職業分組。",o:["Unlike","Besides","Regarding","During"],a:0,why:"以前依年齡、這次依職業 → 對比 unlike。"},
 {t:"quiz",q:"The secret of the children's success is their willingness to engage in ___.",zh:"孩子成功的祕訣是願意反覆嘗試。",o:["trial and error","good and evil","right and wrong","success and failure"],a:0,why:"一直試、一直改 → trial and error。"},
 {t:"quiz",q:"Instead of spending a lot of time talking, they ___ work straight away.",zh:"他們沒有花時間討論，而是直接開始動手。",o:["get down to","are in charge","figure out","roll up their sleeves"],a:0,why:"get down to + N 開始做；roll up one's sleeves 後面不能直接接 work。"},
 {t:"quiz",q:"Despite ___ very hard in the competition, he failed.",zh:"儘管他在比賽中非常努力，還是失敗了。",o:["working","work","worked","to work"],a:0,why:"despite 是介系詞 → 後面接 V-ing。"}
]},
{name:"字彙書 U10–14・單字",em:"📗",sec:"📚 英語高頻字彙",ds:"週考 W4：單字與克漏字",items:[
 {t:"card",tag:"U10–U12",title:"Units 10–12 單字",chips:[["candidate 候選人","a"],["promptly 迅速地","b"],["preference 偏好","c"],["undertake 承擔","d"],["conduct 進行（實驗）","e"],["secure 確保、取得","a"],["deposit 訂金","b"],["landscape 風景","c"]],
  tip:"🔑 promptly 就是 L1 prompt（立即的）加 -ly！",ex:"The firefighters [[promptly]] headed to the scene.",zh:"消防員迅速趕到現場。"},
 {t:"quiz",q:"The company interviewed each ___ carefully before choosing the most qualified person.",zh:"公司仔細面試每位候選人。",o:["candidate","preference","session","research"],a:0,why:"面試的對象 → candidate 候選人。"},
 {t:"quiz",q:"After receiving the emergency call, the firefighters ___ headed to the scene.",zh:"接到緊急電話後，消防員立刻出發。",o:["promptly","occasionally","physically","ultimately"],a:0,why:"緊急 → 迅速地 promptly。"},
 {t:"quiz",q:"From the top of the hill, we could enjoy a beautiful ___ of forests and rivers.",zh:"從山頂可以欣賞森林河流的美景。",o:["landscape","participation","colleague","innovation"],a:0,why:"forests、rivers、mountains → landscape 風景。"},
 {t:"card",tag:"U13–U14",title:"Units 13–14 單字",chips:[["luxurious 奢華的","a"],["compromise 妥協","b"],["agony 劇痛","c"],["procedure 手術、程序","d"],["breakthrough 突破","e"],["demonstrate 示範","a"],["confirm 證實","b"],["awake 醒著的","c"]],
  tip:"🔑 com- 是「一起」：compromise 就是雙方一起讓步。",ex:"Both sides agreed to [[compromise]] and accept some changes.",zh:"雙方同意妥協並接受一些改變。"},
 {t:"quiz",q:"Many buyers were attracted to the car's spacious interior and ___ design.",zh:"很多買家被車子寬敞的內裝和奢華設計吸引。",o:["luxurious","dusty","massive","established"],a:0,why:"expensive 是線索 → luxurious 奢華的。"},
 {t:"quiz",q:"To finish on time, both sides agreed to ___ and accept some changes.",zh:"為了準時完成，雙方同意各退一步。",o:["compromise","revise","calculate","conduct"],a:0,why:"雙方各讓一步 → compromise。"},
 {t:"quiz",q:"Before anesthesia, patients had to remain fully ___ while doctors operated on them.",zh:"在有麻醉以前，病人手術時必須完全清醒。",o:["awake","agony","procedure","effective"],a:0,why:"remain + 形容詞 → awake 醒著的。"},
 {t:"quiz",q:"The ___ was so intense that several strong men were needed to hold patients still.",zh:"劇痛強烈到需要好幾個壯漢壓住病人。",o:["agony","pleasure","breakthrough","procedure"],a:0,why:"so intense、hold patients still → agony 劇痛。"},
 {t:"quiz",q:"Lindgren was disqualified ___ asthma.",zh:"Lindgren 因為氣喘被取消資格。",o:["due to","despite","except for","without"],a:0,why:"原因 → due to 因為。"},
 {t:"quiz",q:"After all his hard work, his persistence finally ___ in 2009.",zh:"他的堅持終於在 2009 年有了回報。",o:["paid off","showed off","set off","took off"],a:0,why:"努力有回報 → pay off。"}
]},
{name:"字彙書 U10–14・片語",em:"📘",ds:"週考 W4：翻譯片語",items:[
 {t:"card",tag:"U11–U14",title:"週考翻譯片語",chips:[["call for 需要","a"],["rite of passage 成年禮","b"],["take…for granted 視為理所當然","c"],["be grateful for 感謝","d"],["on the spur of the moment 一時興起","e"],["at one's own pace 照自己的步調","a"],["smooth sailing 一帆風順","b"],["map out 詳細規劃","c"]],
  tip:"🔑 這些都是翻譯填空的答案，聽一次、點一次就記住！",ex:"We may [[take anesthesia for granted]] today.",zh:"今天我們可能把麻醉視為理所當然。"},
 {t:"quiz",q:"An around-the-island trip ___ months of preparation.",zh:"環島旅行需要數個月的準備。",o:["calls for","pays off","sets off","turns out"],a:0,why:"call for 需要。"},
 {t:"quiz",q:"Young Australians regard it as an important ___.",zh:"年輕澳洲人把它當作重要的成年禮。",o:["rite of passage","smooth sailing","spur of the moment","trial and error"],a:0,why:"成年禮 → rite of passage。"},
 {t:"quiz",q:"A $20 deposit is required to ___ your reservation.",zh:"需要支付 20 美元訂金來確保您的預訂。",o:["secure","conduct","undertake","demonstrate"],a:0,why:"secure a reservation 確保訂位。"},
 {t:"quiz",q:"Although we may ___ anesthesia ___ today, we should remain grateful.",zh:"雖然我們可能把麻醉視為理所當然…",o:["take … for granted","call … for","map … out","turn … down"],a:0,why:"take sth for granted 視為理所當然。"},
 {t:"quiz",q:"We should remain grateful ___ the pioneers who made it possible.",zh:"我們應該感謝那些先驅。",o:["for","to","with","of"],a:0,why:"be grateful for + 事／人（感謝他們做的事）。"},
 {t:"quiz",q:"Traveling alone allows people to change their plans ___.",zh:"獨旅讓人可以臨時起意改變計畫。",o:["on the spur of the moment","at their own pace","as a result","after all"],a:0,why:"臨時起意 → on the spur of the moment。"},
 {t:"quiz",q:"Travelers can explore destinations ___ their own pace.",zh:"依照自己的步調探索各地。",o:["at","in","on","by"],a:0,why:"at one's own pace 照自己的步調。"},
 {t:"quiz",q:"While group trips offer many advantages, they are not always ___.",zh:"團體旅行不總是一帆風順。",o:["smooth sailing","a rite of passage","worth a fortune","nothing but"],a:0,why:"一帆風順 → smooth sailing。"},
 {t:"quiz",q:"Books such as The Right Stuff inspired him to ___ a plan for achieving his goal.",zh:"書籍啟發他詳細規劃達成目標的計畫。",o:["map out","turn out","adapt to","tend to"],a:0,why:"map out a plan 詳細規劃（R1 片語）。"}
]},
{name:"字彙書 U1–9・單字",em:"📙",ds:"週考 W1–W3 單字題",items:[
 {t:"card",tag:"Units 1–9",title:"週考單字",chips:[["strengthen 加強","a"],["harsh 惡劣的","b"],["exceed 超過","c"],["ultimately 最終","d"],["variation 差異","e"],["abstract 抽象的","a"],["contribution 貢獻","b"],["strain 使緊繃","c"],["rigid 嚴格的","d"],["endure 持續、忍受","e"],["accessible 容易取得的","a"]],
  tip:"🔑 單字題先找線索字：strong winds → harsh；remote areas → accessible。",ex:"Online shopping sales are expected to [[exceed]] last year's.",zh:"網購銷售預計會超過去年。"},
 {t:"quiz",q:"The company plans to ___ its relationship with customers by improving service.",zh:"公司打算改善服務來加強和顧客的關係。",o:["strengthen","prompt","absorb","generate"],a:0,why:"加強關係 → strengthen。"},
 {t:"quiz",q:"The hikers had to deal with ___ weather, including strong winds and heavy rain.",zh:"登山客要面對強風豪雨的惡劣天氣。",o:["harsh","internal","essential","fascinating"],a:0,why:"strong winds、heavy rain → harsh 惡劣的。"},
 {t:"quiz",q:"Learning a language requires patience, but it can ___ open doors to opportunities.",zh:"學語言需要耐心，但最終能打開機會之門。",o:["ultimately","worldwide","otherwise","individually"],a:0,why:"努力之後的結果 → ultimately 最終。"},
 {t:"quiz",q:"The artist's work uses ___ shapes and colors rather than realistic objects.",zh:"這位藝術家用抽象的形狀和顏色，而非寫實的物體。",o:["abstract","conventional","professional","beloved"],a:0,why:"rather than realistic → 不寫實 = abstract。"},
 {t:"quiz",q:"Amy's ___ was especially valuable because she solved several difficult problems.",zh:"Amy 的貢獻特別寶貴，因為她解決了好幾個難題。",o:["contribution","combination","behavior","atmosphere"],a:0,why:"play a role、solved problems → contribution 貢獻。"},
 {t:"quiz",q:"Looking down at a smartphone for long periods can ___ the neck muscles.",zh:"長時間低頭看手機會讓頸部肌肉緊繃。",o:["strain","orbit","loosen","endure"],a:0,why:"lead to discomfort → strain 使緊繃、拉傷。"},
 {t:"quiz",q:"Because of the ___ safety rules, workers had to complete every step.",zh:"因為安全規定很嚴格，工人每一步都得做。",o:["rigid","striking","flexible","unidentified"],a:0,why:"規定嚴格、不能變通 → rigid（相反詞 flexible）。"},
 {t:"quiz",q:"The legend has ___ for generations, passed down from parents to children.",zh:"這個傳說流傳了好幾代。",o:["endured","encountered","overthrown","accomplished"],a:0,why:"endure 也可以是「持續、留存」。"},
 {t:"quiz",q:"Thanks to online libraries, resources are now more ___ to students in remote areas.",zh:"多虧線上圖書館，偏遠地區的學生更容易取得資源。",o:["accessible","compelling","polished","distinct"],a:0,why:"be accessible to sb 某人容易取得。"}
]},

// ===== 狀態 =====
const KEY="b3l13_quest";
let save={stars:0,done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)save=s}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
let L=null,queue=[],pos=0,combo=0,firstTry=true;
const app=document.getElementById("app");
const CHEER=["太強了！🎉","答對！你超棒 ✨","完美！💯","耶～就是這樣！🥳","腦袋好清楚！🧠","連擊中！🔥"];
const SOFT=["沒關係，再看一次 💪","差一點點！再試試 🌱","慢慢來，你可以的 😊"];

// ===== 音效（不用檔案） =====
let ac;
function tone(fs,d=.12){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;
 fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f;
 g.gain.setValueAtTime(.18,t+i*d);g.gain.exponentialRampToValueAtTime(.001,t+i*d+d*1.8);o.connect(g);g.connect(ac.destination);o.start(t+i*d);o.stop(t+i*d+d*2)})}catch(e){}}
const sOK=()=>tone([660,880,1175]),sNO=()=>tone([330,294],.15),sWIN=()=>tone([523,659,784,1047,1319],.11),sTap=()=>tone([880],.06);
function speak(txt){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt.replace(/\[\[|\]\]/g,"").replace(/___/g,"blank"));u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function rain(em){for(let i=0;i<14;i++){const d=document.createElement("div");d.className="fx";d.textContent=em[i%em.length];
 d.style.left=Math.random()*95+"vw";d.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}}
function upStars(){document.getElementById("stars").textContent="⭐ "+save.stars}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

// ===== 首頁地圖 =====
function home(){L=null;upStars();
 app.innerHTML=`<div class="hero"><div class="arch"><img src="${ART}" alt=""></div><div><div class="orn">✦ ✧ ✦</div><h1>段考考點闖關</h1><div class="sub">B3 L1～L3・R1・考古題・高頻字彙<br>一次一關，全部用點的</div></div></div><div class="map">`+
 LEVELS.map((l,i)=>`${l.sec?`<div class="sec">${l.sec}</div>`:""}<button class="lv" onclick="start(${i})"><span class="em">${l.em}</span><span><div class="nm">第 ${i+1} 關｜${l.name}</div><div class="ds">${l.ds}</div></span><span class="ck">${save.done[i]?"🏅":"▶️"}</span></button>`).join("")+`</div>`}

function start(i){sTap();L=i;queue=LEVELS[i].items.map(x=>Object.assign({},x));pos=0;combo=0;show()}

function topbar(){const pct=Math.round(pos/queue.length*100);
 return `<div class="top"><button class="back" onclick="home()">🏠</button><div class="bar"><i style="width:${pct}%"></i></div><span style="font-size:16px">${pos}/${queue.length}</span></div>`}

function show(){if(pos>=queue.length)return win();
 const it=queue[pos];firstTry=true;window.scrollTo(0,0);
 it.t==="card"?card(it):quiz(it)}

// ===== 重點卡 =====
function card(it){let d=0;
 const chips=it.chips.map(c=>c[0]==="row"?'<div class="row"></div>':`<span class="chip ${c[1]==="ar"?"ar":"k-"+(c[1]||"d")}" style="animation-delay:${(d++)*.18}s">${esc(c[0])}</span>`).join("");
 const ex=esc(it.ex).replace(/\[\[(.+?)\]\]/g,(m,k)=>`<span class="key" data-k="${k}" onclick="reveal(this)">👆 點我</span>`);
 app.innerHTML=topbar()+`<div class="box"><span class="tag">${it.tag}</span><div class="ttl">${it.title}</div><div class="chips">${chips}</div>
 <div class="tip">${it.tip}</div><div class="ex">${ex}<button class="say" onclick="speak(queue[pos].ex)">🔊</button><div class="zh">${it.zh}</div></div>
 <button class="btn" onclick="next()">我懂了 👉</button></div>`}
function reveal(el){sTap();el.textContent=el.dataset.k;el.classList.add("open")}

// ===== 點選題 =====
function quiz(it){
 const order=it.o.map((x,i)=>i).sort(()=>Math.random()-.5);
 const q=esc(it.q).replace("___",'<span class="blank">?</span>').replace("___",'<span class="blank">?</span>');
 app.innerHTML=topbar()+`<div class="box"><span class="tag">練習一下${it.again?'<span class="again">再見一次</span>':""}</span>
 <div class="q">${q} <button class="say" onclick="speak(queue[pos].q)">🔊</button></div><div class="zh">${it.zh}</div>
 <div class="opts">${order.map(i=>`<button class="opt" data-i="${i}" onclick="pick(this)">${esc(it.o[i])}</button>`).join("")}</div>
 <div class="cheer" id="cheer"></div><div id="after"></div></div>`}
function pick(b){const it=queue[pos],i=+b.dataset.i;
 if(b.classList.contains("no")||document.querySelector(".opt.ok"))return;
 if(i===it.a){b.classList.add("ok");sOK();combo++;save.stars+=firstTry?2:1;upStars();store();
  document.getElementById("cheer").textContent=combo>=3?`🔥 ${combo} 連擊！`:CHEER[Math.floor(Math.random()*CHEER.length)];
  if(combo%3===0)rain(["✦","✧","⭐"]);
  const full=it.q.replace("___",it.o[it.a].split(" … ")[0]).replace("___",(it.o[it.a].split(" … ")[1]||""));
  document.getElementById("after").innerHTML=`<div class="why">💡 ${it.why}</div><button onclick="speak('${full.replace(/'/g,"\\'")}')" class="btn alt">🔊 聽完整句子</button><button class="btn" onclick="next()">下一個 👉</button>`;
 }else{b.classList.add("no");sNO();combo=0;
  document.getElementById("cheer").textContent=SOFT[Math.floor(Math.random()*SOFT.length)];
  if(firstTry&&!it.again){queue.push(Object.assign({},it,{again:true}))}
  firstTry=false}}
function next(){sTap();pos++;show()}

// ===== 過關 =====
function win(){save.done[L]=true;save.stars+=5;store();upStars();sWIN();rain(["✦","✧","❀","🤍","✦"]);
 const nx=L+1<LEVELS.length;
 app.innerHTML=`<div class="box" style="text-align:center"><div class="winimg"><img src="${ART}" alt=""></div><div class="orn">✦ ✧ ✦</div><div class="ttl">第 ${L+1} 關 過關！</div>
 <div style="font-size:20px">「${LEVELS[L].name}」你全部搞定了 ✨<br>獎勵 ⭐ +5</div>
 ${nx?`<button class="btn" onclick="start(${L+1})">下一關：${LEVELS[L+1].em} ${LEVELS[L+1].name} 👉</button>`:`<div class="tip" style="margin-top:18px">🎊 ${LEVELS.length} 關全破！段考加油，你一定可以！</div>`}
 <button class="btn alt" onclick="home()">回到地圖 🗺️</button></div>`}
home();
</script>
</body>
</html>
